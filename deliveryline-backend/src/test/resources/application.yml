deliveryline:
  home: ${java.io.tmpdir}/deliveryline-test-home
  runner:
    stale-threshold-multiplier: 2.0
    timeout-scan-interval-ms: 10000
    timeout-scan-batch-size: 50
    poll-interval-ms: 5000
    stage-timeouts:
      investigation: 600s
      execution: 600s
    recovery:
      batch-size: 100
    mock:
      default-scenario:
        investigation: happy-spec
        execution: happy-implementation-plan
    scheduling:
      enabled: false

spring:
  docker:
    compose:
      enabled: false
      skip:
        in-tests: true
