deliveryline:
  home: ${java.io.tmpdir}/deliveryline-test-home
  frontend:
    # The Vite SPA bundle is never built into the classpath during the test tier, so the
    # EmbeddedFrontendGuard fail-fast MUST be disabled here (the test application.yml shadows — does
    # not merge with — the main one; memory: validated-config-needs-test-yaml). Production defaults
    # this to true.
    fail-on-missing-bundle: false
  linear:
    base-url: https://api.linear.app/graphql
    poll-interval-ms: 60000
    poll-batch-size: 50
    stale-threshold-multiplier: 2.0
    timeout:
      connect-ms: 5000
      read-ms: 30000
    polling:
      enabled: false
  github:
    # Story 3.14 — mirror the real application.yml non-secret github knobs so the profile-neutral
    # GitHubProperties binding does not shadow the defaults to surprising values in the
    # @SpringBootTest tier (memory: validated-config-needs-test-yaml). No token here — github-real
    # is never in a test profile group, so the gitHubRestClient fail-fast never fires under tests.
    token: ${GITHUB_TOKEN:}
    base-url: https://api.github.com
    api-version: "2022-11-28"
    rate-limit-warn-threshold: 100
    timeout:
      connect-ms: 5000
      read-ms: 30000
  complex-ticket-flow:
    # Story 3f-7 (AC5 / Trap) — mirror deliveryline.complex-ticket-flow.* so the validated
    # ComplexTicketFlowProperties binding does not shadow the default to a surprising value in the
    # @SpringBootTest tier (memory: validated-config-needs-test-yaml — the test yaml shadows main).
    # Recursive-split depth cap; SplitProposalServiceTest depth cases drive it via construction.
    max-split-depth: 3
    # Story 3f-8 (AC4 / Trap) - mirror deliveryline.complex-ticket-flow.rollup-sweep.* (the test yaml
    # SHADOWS, does not merge with, main). Sweep is DISABLED in the shared test profile so no
    # @Scheduled trigger bean is registered and no always-on sweep fires during unrelated
    # @SpringBootTests; SplitRollupReconciliationSweepServiceIT invokes sweep() directly (no scheduler
    # wait),
    # and the disabled-flag config test asserts the absence of the bean.
    rollup-sweep:
      enabled: false
      interval-ms: 60000
      batch-limit: 100
  workflow:
    # Story 3.9 Trap T2 — mirror the deliveryline.workflow.* keys so the validated WorkflowProperties
    # binding does not shadow defaults to surprising values in the @SpringBootTest tier (memory:
    # validated-config-needs-test-yaml). Bot left unset → empty (the git-bot-identity probe is
    # not-applicable under tests since github-real is never in a test profile group).
    bot:
      name: ${DELIVERYLINE_BOT_NAME:}
      email: ${DELIVERYLINE_BOT_EMAIL:}
    # Story 3.16 (AC7/AC8 / Trap T5) — mirror the validated linear-completion-sync keys (the test
    # application.yml shadows, does not merge with, main). `enabled` is OFF in the shared test
    # profile (mirroring spec-stage.auto-dispatch: false) so the COMPLETED-transition post-commit
    # hook stays a no-op across the existing suite and no @SpringBootTest reaches the (mock) Linear
    # adapter unexpectedly; WorkflowOrchestrationServiceTest / the hook test drive it directly or opt
    # in via @TestPropertySource. A valid template is still supplied so the startup validator (which
    # only runs when enabled) never trips, and the default-template fallback is exercised.
    linear-completion-sync:
      enabled: false
      template: "DeliveryLine governed run `{runId}` completed: PR `{prUrl}` ready for merge. Spec: `{specSummary}` (v{specVersion}). Reviewers: PM `{pmReviewer}`, Dev `{devReviewer}`. Cycle time: `{durationFormatted}`."
  runner:
    stale-threshold-multiplier: 2.0
    timeout-scan-interval-ms: 10000
    timeout-scan-batch-size: 50
    stale-scan-interval-ms: 60000
    poll-interval-ms: 5000
    # Story 3.17a (AC4 / Trap T5) — validated cap must be mirrored here (test application.yml shadows,
    # does not merge with, main). 100 matches production; RunnerExecutionQueueIT exercises
    # RUNNER_QUEUE_FULL by seeding 100 queued rows against this default cap (no @TestPropertySource).
    queue-max-depth: 100
    # Story 3.17b (Trap T8 / D9) — the worker pool is OFF in the shared test profile so an always-on
    # pool never dequeues/dispatches during unrelated @SpringBootTests (it shadows main; an absent
    # key would also bind enabled=false, but mirror it explicitly for clarity). The activation ITs
    # opt in via @TestPropertySource(worker-pool.enabled=true).
    worker-pool:
      enabled: false
      size: 2
      backoff:
        initial: 1s
        max: 10s
    stage-timeouts:
      investigation: 600s
      execution: 600s
    # Story 3a-1 (AC10 / Trap T4) — the validated spec-stage group must be present here too, since
    # the test application.yml shadows (does not merge with) the main one. auto-dispatch is OFF in
    # the shared test profile (mirrors scheduling.enabled: false) so the existing submit/reject
    # tests stay deterministic; the dedicated 3a-1 integration test opts in via @TestPropertySource.
    spec-stage:
      kind: codex
      auto-dispatch: false
    # Story 3.11 (AC10 / Trap T4/T11) — the validated plan-stage group must be present here too (test
    # application.yml shadows, does not merge with, main). auto-dispatch is OFF in the shared test
    # profile so every approveSpec test stays a no-op dispatch; ImplementationPlanOrchestrationIT
    # opts in via @TestPropertySource.
    plan-stage:
      kind: codex
      auto-dispatch: false
    # Story 3.12 (AC1 / Trap T7) — the validated implementation-stage group must be present here too
    # (test application.yml shadows, does not merge with, main). auto-dispatch is OFF in the shared
    # test profile so dispatchImplementation stays a no-op; PrOutputOrchestrationIT opts in via
    # @TestPropertySource.
    implementation-stage:
      kind: codex
      auto-dispatch: false
    recovery:
      batch-size: 100
    mock:
      default-scenario:
        investigation: happy-spec
        execution: happy-implementation-plan
    scheduling:
      enabled: false
    # Story 3.6 AC4 — explicit local-only default (mirrors the real application.yml so the
    # validated binding does not shadow it to a surprising value in the @SpringBootTest tier).
    allow-shareable-logs: false
    # Story 3.5 — per-kind agent-provider env-var NAMES (never values). Mirrors the real
    # application.yml so the validated @ConfigurationProperties binding does not shadow the
    # defaults to empty in the @SpringBootTest tier (memory: validated-config-needs-test-yaml).
    secret-env-names:
      codex:
        - CODEX_AUTH_JSON
        - CODEX_API_KEY
        - OPENAI_API_KEY
      claude:
        - CLAUDE_CODE_OAUTH_TOKEN
        - ANTHROPIC_API_KEY
    # Story 3.1 — under tests, override the Docker runner image tags to a stable, tiny
    # image (alpine:3.20) so docker-runner ITs do not depend on the not-yet-built
    # Codex / Claude images (stories 3.3 / 3.4). The fast tier never activates the
    # runners.docker profile; this block is only consulted by docker-runner-it ITs.
    docker:
      default-kind: codex
      image-tags:
        codex: alpine:3.20
        claude: alpine:3.20
      workspace-root: ${deliveryline.home}/runner-work
      workspace-retention-hours: 1
      workspace-cleanup-interval-ms: 3600000
      container-create-timeout: 30s
      container-start-timeout: 30s
      # Story 3.2a AC4 — dangling-container sweep min-age grace window.
      dangling-container-min-age-seconds: 120

# Story 3.19 (AC5 / Reconciliation 4) — the test application.yml SHADOWS (does not merge with) main,
# so the management exposure MUST be mirrored here or the @SpringBootTest-booted scrapeable check
# (RunnerQueuePrometheusScrapeIT) would 404 /actuator/prometheus (memory: validated-config-needs-test-yaml).
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

spring:
  # Story 2.13 round-3 review D3 follow-up: keep test slice fail-on-unknown aligned with prod config
  # so the @JsonIgnoreProperties(ignoreUnknown = false) annotation on request DTOs actually rejects
  # legacy bodies (pre-2.13 `actorIdentity` field, etc.) instead of silently accepting them.
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  docker:
    compose:
      enabled: false
      skip:
        in-tests: true
