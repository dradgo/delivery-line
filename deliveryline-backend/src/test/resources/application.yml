deliveryline:
  home: ${java.io.tmpdir}/deliveryline-test-home
  linear:
    base-url: https://api.linear.app/graphql
    poll-interval-ms: 60000
    poll-batch-size: 50
    stale-threshold-multiplier: 2.0
    timeout:
      connect-ms: 5000
      read-ms: 30000
    polling:
      enabled: false
  runner:
    stale-threshold-multiplier: 2.0
    timeout-scan-interval-ms: 10000
    timeout-scan-batch-size: 50
    stale-scan-interval-ms: 60000
    poll-interval-ms: 5000
    stage-timeouts:
      investigation: 600s
      execution: 600s
    recovery:
      batch-size: 100
    mock:
      default-scenario:
        investigation: happy-spec
        execution: happy-implementation-plan
    scheduling:
      enabled: false
    # Story 3.1 — under tests, override the Docker runner image tags to a stable, tiny
    # image (alpine:3.20) so docker-runner ITs do not depend on the not-yet-built
    # Codex / Claude images (stories 3.3 / 3.4). The fast tier never activates the
    # runners.docker profile; this block is only consulted by docker-runner-it ITs.
    docker:
      default-kind: codex
      image-tags:
        codex: alpine:3.20
        claude: alpine:3.20
      workspace-root: ${deliveryline.home}/runner-work
      workspace-retention-hours: 1
      workspace-cleanup-interval-ms: 3600000
      container-create-timeout: 30s
      container-start-timeout: 30s
      # Story 3.2a AC4 — dangling-container sweep min-age grace window.
      dangling-container-min-age-seconds: 120

spring:
  # Story 2.13 round-3 review D3 follow-up: keep test slice fail-on-unknown aligned with prod config
  # so the @JsonIgnoreProperties(ignoreUnknown = false) annotation on request DTOs actually rejects
  # legacy bodies (pre-2.13 `actorIdentity` field, etc.) instead of silently accepting them.
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  docker:
    compose:
      enabled: false
      skip:
        in-tests: true
