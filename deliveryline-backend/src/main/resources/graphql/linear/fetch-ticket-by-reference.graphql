query FetchTicketByReference($teamKey: String!, $number: Float!) {
  issues(
    filter: { team: { key: { eq: $teamKey } }, number: { eq: $number } }
    first: 1
  ) {
    nodes {
      id
      identifier
      title
      description
      createdAt
      updatedAt
      creator {
        email
        displayName
      }
      labels {
        nodes {
          name
        }
      }
      state {
        id
        name
      }
      team {
        id
      }
    }
  }
}
