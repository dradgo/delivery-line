query PollTicketsSince($filter: IssueFilter!, $first: Int!, $after: String) {
  issues(filter: $filter, orderBy: updatedAt, first: $first, after: $after) {
    nodes {
      identifier
      title
      description
      createdAt
      updatedAt
      creator {
        email
        displayName
      }
      labels {
        nodes {
          name
        }
      }
      state {
        id
        name
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
