query PollTicketsSince($since: DateTime!, $first: Int!, $after: String) {
  issues(
    filter: { updatedAt: { gt: $since } }
    orderBy: updatedAt
    first: $first
    after: $after
  ) {
    nodes {
      identifier
      title
      description
      createdAt
      updatedAt
      creator {
        email
        displayName
      }
      labels {
        nodes {
          name
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
