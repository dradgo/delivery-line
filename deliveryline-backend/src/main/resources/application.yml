# Story 3.19 (AC5) — expose Actuator's Prometheus scrape endpoint (and health) so the optional
# observability stack (AR25) can scrape runner-queue metrics at /actuator/prometheus. Only these two
# endpoints are exposed; everything else stays off the web surface.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

spring:
  application:
    name: deliveryline
  # Story 3.17b (AC10) — graceful-shutdown drain budget. The RunnerWorkerPool (SmartLifecycle) gets
  # up to this window on SIGTERM to let any in-flight dispatch finish before the executor stops;
  # queued rows are untouched and survive the restart.
  lifecycle:
    timeout-per-shutdown-phase: 60s
  # Story 3.5 AC2 — load runner secrets (agent-provider API keys) from a local ./.env file when
  # present. The [.properties] extension hint makes Spring parse the extensionless .env as
  # KEY=VALUE properties. `optional:` keeps startup working when no .env exists (process env or
  # Compose env_file then supplies the values). Values are NEVER committed and NEVER appear as
  # application.yml defaults — only env-var NAMES are configured (deliveryline.runner.secret-env-names).
  config:
    import: "optional:file:./.env[.properties]"
  profiles:
    group:
      # Story 3.13 — github-mock joins the default mock stack alongside linear-mock so the full
      # execution loop runs against deterministic, zero-network integrations in test/local/demo.
      local: [runners.mock, linear-mock, github-mock]
      test: [runners.mock, linear-mock, github-mock]
      demo: [runners.mock, linear-mock, github-mock]
  # Story 2.13 round-3 review D3 follow-up: make `@JsonIgnoreProperties(ignoreUnknown = false)` on
  # request DTOs actually enforce rejection. Spring Boot's autoconfigured ObjectMapper otherwise
  # disables FAIL_ON_UNKNOWN_PROPERTIES, leaving the annotation no global default to defer to and
  # silently accepting legacy fields (e.g. pre-2.13 `actorIdentity` in body). Flipping the global
  # to `true` lets the per-class annotation surface unknown properties as INVALID_COMMAND_PAYLOAD
  # via ProblemDetailsMapper.handleHttpMessageNotReadable. DTOs that legitimately need lenient
  # behaviour must opt in with `@JsonIgnoreProperties(ignoreUnknown = true)`.
  jackson:
    deserialization:
      fail-on-unknown-properties: true

# Story 6.9 — localhost-only safe-by-default REST binding. The Phase-1 MVP ships no
# auth; loopback-only binding IS the security control. RestBindingGuard fails startup
# (DOCTOR_REST_BIND_UNAVAILABLE) if the effective bind address is non-loopback unless
# deliveryline.rest.unsafe-network-bind=true is explicitly set.
server:
  address: 127.0.0.1
  port: 8080

# Story 6.9 — deterministic OpenAPI output so the committed openapi.json snapshot diff
# (CI drift gate) is stable across runs/platforms: sort keys, no build timestamps.
springdoc:
  writer-with-order-by-keys: true
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

deliveryline:
  codex:
    # Story 3.8 — optional host path to the Codex subscription auth.json (e.g. ~/.codex/auth.json).
    # When set, the backend reads it LIVE on every dispatch and injects it as CODEX_AUTH_JSON, so the
    # host `codex` CLI's CURRENT (rotated) token is always used. Subscription OAuth refresh tokens are
    # single-use, so a frozen CODEX_AUTH_JSON env value goes stale ("refresh_token_reused" 401) once
    # any run/host refreshes it; sourcing the live file avoids that. Blank → use the CODEX_AUTH_JSON
    # env var. Also settable via the CODEX_AUTH_JSON_FILE env var (read directly when this is unset).
    auth-json-file: ${CODEX_AUTH_JSON_FILE:}
  frontend:
    # When true (default), the app FAILS FAST at startup unless the Vite SPA bundle is embedded on
    # the classpath (classpath:/static/index.html) — produced by `mvn package` (the frontend module
    # builds target/dist, the backend copies it into BOOT-INF/classes/static). This guards against
    # shipping/running an API-only jar that 404s the UI. Set to false for an API-only run that uses
    # the Vite dev server on :5173 instead (the dev server proxies /api → :8080). EmbeddedFrontend
    # deep-link routing (NoResourceFoundException → index.html) is unconditional and simply inert
    # when no bundle is present.
    fail-on-missing-bundle: true
  approval:
    # MVP fallback for the legacy WorkflowController.approveSpec REST surface that does not yet
    # accept an actor-identity / reviewer-role header (story 2.13 rebuilds that surface). When the
    # request body supplies a non-blank `reviewerRole`, it is used verbatim; otherwise this value
    # is stamped on the persisted approvals row and the approval.approved audit event.
    default-reviewer-role: product_reviewer
  complex-ticket-flow:
    # Story 3f-7 (AC5): recursive-split depth cap. A run whose split depth (distance from the
    # lineage root, walking parentRunId; root = depth 0) is already >= this value is refused with
    # SPLIT_DEPTH_LIMIT_EXCEEDED when REQUEST_SPLIT is invoked, UNLESS the request carries the
    # allowDeepSplit override (X-Allow-Deep-Split header / --allow-deep-split CLI flag), in which
    # case the deep split is permitted and the override is recorded in the governed history. Default
    # 3 (a depth-3 run is refused — its children would be depth 4); <=0 normalized to 3.
    max-split-depth: 3
    # Story 3f-8 (AC4) - split-rollup reconciliation sweep: durability for the 3f-7 completion-rollup
    # hook. That SPLIT->COMPLETED rollup is driven SOLELY by the afterCommit hook on the LAST child's
    # COMPLETED transition; a transient failure (advisory-lock timeout/deadlock/optimistic-lock/DB
    # blip) of that one best-effort REQUIRES_NEW execution permanently strands the parent in Split
    # with cross-split dependents blocked (no later event re-fires it). When enabled, a scheduled,
    # advisory-locked sweep periodically finds Split parents whose direct children are ALL Completed
    # and re-invokes the idempotent rollup (Split->Completed). `enabled` gates the scheduler bean via
    # @ConditionalOnProperty - when false/absent NO scheduled bean is registered (the hook path is
    # byte-identical to today). `interval-ms` is the fixed delay between ticks (<=0 normalized to
    # 60000). `batch-limit` caps stranded parents scanned per tick - the sweep WARNs when a tick fills
    # the batch (no silent truncation) and the remainder heals on the next tick (<=0 normalized to
    # 100). Default OFF: the sweep is a safety net for a rare transient strand, opted in per-deploy.
    rollup-sweep:
      # Enabled per Epic 3f retrospective (2026-07-01): the 3f-7 completion-rollup is driven solely by
      # the last child's afterCommit hook; a transient failure strands the parent in Split with no
      # re-fire. Turning the safety-net sweep on for the pilot so a stranded parent self-heals.
      enabled: true
      interval-ms: 60000
      batch-limit: 100
  workflow:
    # Story 2.10 (FR13): threshold above which ApprovalService.rejectSpec raises the per-run
    # escalation marker. The escalation event is appended exactly once (when the counter crosses
    # the threshold from below); subsequent rejections continue to advance the counter and the
    # workflow stays in Investigating — escalation does NOT terminate the workflow.
    spec-rejection-escalation-threshold: 3
    # Story 3.21 (FR13): threshold above which TechnicalApprovalService.rejectImplementation raises
    # the per-run escalation marker (the SAME marker as the spec-rejection loop — Decision D5). The
    # escalation event is appended exactly once (when the implementation-rejection counter crosses
    # the threshold from below); subsequent rejections continue to advance the counter and the
    # workflow stays in Executing — escalation does NOT terminate the workflow.
    implementation-rejection-escalation-threshold: 3
    # Story 3h-1 (FR75): the bounded build auto-fix cap AND escalation threshold (one value; read by
    # BuildFixEscalationThresholdProvider). On a BUILD failure the implementation runner is
    # re-dispatched with the build-error log as referenced feedback for up to N (=this value) fix
    # attempts; the run transitions to FAILED (runner_build_failed) on the (N+1)-th consecutive build
    # failure (build_fix_loop_count > cap) and the SHARED per-run escalation marker is flipped once
    # (same marker as the spec / implementation loops, D5).
    build-fix-max-loops: 3
    # Story 3h-2 (FR76): the bounded lint auto-fix cap AND escalation threshold (one value; read by
    # LintFixEscalationThresholdProvider). Unlike the build loop the lint loop is OPERATOR-DRIVEN
    # (request_lint_fix) and NEVER auto-FAILs the run: on each request_lint_fix the run re-dispatches
    # EXECUTION and re-parks at WaitingForLintApproval. When lint_fix_loop_count reaches this cap the
    # SHARED per-run escalation marker is flipped once (visibility only — same marker as the other
    # loops, D5); the run stays parked, so there is no infinite-loop risk (each iteration needs a
    # manual operator action).
    lint-fix-max-loops: 3
    # Story 3f-4 (AC4): threshold above which SplitProposalService.repropose raises the per-run
    # escalation marker (the SAME marker as the spec-rejection / implementation-rejection loops). The
    # escalation event is appended exactly once (when the split-proposal re-propose counter crosses
    # the threshold from below); subsequent re-proposes continue to advance the counter and the run
    # stays parked at its gate — escalation does NOT terminate the workflow or move the gate.
    split-proposal-escalation-threshold: 3
    # Story 3.9 (Decision D8) — deliveryline-bot git identity for RepositoryWorkspaceService commits.
    # Supplied at runtime via DELIVERYLINE_BOT_NAME / DELIVERYLINE_BOT_EMAIL (.env / process env);
    # blank ⇒ the built-in default identity is used for commits and the doctor git-bot-identity probe
    # WARNs (DOCTOR_GIT_BOT_IDENTITY_UNCONFIGURED) under the github-real profile.
    bot:
      name: ${DELIVERYLINE_BOT_NAME:}
      email: ${DELIVERYLINE_BOT_EMAIL:}
    # Story 3a-2 / 3.9 — single pilot repository (1:1). Uncomment + set `url` to enable the repo
    # workspace seam on the spec/investigation stage. Also requires the `github-real` profile AND a
    # GITHUB_TOKEN (repo scope — clones private repos over HTTPS via the x-access-token PAT helper).
    # `url` accepts an owner/repo slug, an HTTPS clone URL, or an SSH SCP URL — all normalized to
    # owner/repo; the clone itself always uses the API-derived HTTPS URL + the PAT (no SSH transport).
    #   repos:
    #     url: dradgo/delivery-line   # or https://github.com/dradgo/delivery-line.git or git@github.com:dradgo/delivery-line.git
    #     clone-depth: 1              # shallow by default; <=0 normalized to 1
    #     sparse-paths: []            # empty ⇒ full-tree checkout
    # Story 3.16 (AC7/AC8) — Linear completion-sync: write a merge-ready summary back to the source
    # Linear ticket when a governed run reaches Completed. `enabled` (default true) is the pilot
    # opt-out — doctor reports the current setting. `template` is the merge-ready summary; known
    # placeholders: {runId} {prUrl} {specSummary} {specVersion} {pmReviewer} {devReviewer}
    # {durationFormatted}; required: {runId}. An invalid template (unknown/missing placeholder) fails
    # context startup with INVALID_COMPLETION_TEMPLATE. Posting is best-effort, after-the-fact, and
    # redaction-enforced — it never blocks the governed flow.
    linear-completion-sync:
      enabled: true
      template: "DeliveryLine governed run `{runId}` completed: PR `{prUrl}` ready for merge. Spec: `{specSummary}` (v{specVersion}). Reviewers: PM `{pmReviewer}`, Dev `{devReviewer}`. Cycle time: `{durationFormatted}`."
  rest:
    # Optional override for server.address. Leave unset to inherit the loopback default above.
    # bind-address: 0.0.0.0
    unsafe-network-bind: false
  security:
    # Story 2.13 — MVP local-trusted-user fallback for the actor identity stamped on REST mutation
    # commands when the X-Actor-Identity request header (or CLI --actor-identity flag) is missing or
    # blank. Mirrors the localhost-only safe-by-default REST binding posture (architecture lines
    # 256-257, audit-only RBAC). Production deployments MUST override.
    local-actor-identity: local-operator
  # Story 3.32 — ticket-source selector (deliveryline.integration.ticket-source.kind). `kind` names
  # the vendor implementation backing the vendor-neutral TicketSourceAdapter port. `linear` (the
  # default when unset) is the only kind shipped today; future kinds (jira, github-issues,
  # gitlab-issues) plug in by adding an implementation + a profile entry. The load-bearing bean
  # gating remains the linear-mock/linear-real Spring profiles; LinearConfiguration fail-fasts at
  # boot if `kind` names a kind with no implementation on the classpath. (Renaming the
  # deliveryline.linear.* keys to deliveryline.integration.ticket-source.linear.* is an ops-breaking
  # change intentionally out of scope — see docs/adr/0007-ticket-source-abstraction.md.)
  # Story 3.33 — repository-host selector (deliveryline.integration.repo-host.kind). `kind` names
  # the host implementation backing the vendor-neutral RepositoryHostAdapter port. `github` (the
  # default when unset) is the only kind shipped today; future kinds (bitbucket, gitlab, gitea,
  # azure-devops) plug in by adding an implementation + a profile entry. The load-bearing bean
  # gating remains the github-mock/github-real Spring profiles; GitHubConfiguration fail-fasts at
  # boot if `kind` names a kind with no implementation on the classpath. (Renaming the
  # deliveryline.github.* keys to deliveryline.integration.repo-host.github.* is an ops-breaking
  # change intentionally out of scope — see docs/adr/0008-repository-host-abstraction.md.)
  # integration:
  #   ticket-source:
  #     kind: linear
  #   repo-host:
  #     kind: github
  crypto:
    # Story 3c-4 — the Base64-encoded 256-bit master key (KEK) that wraps per-credential data keys
    # for the connector-credential cipher. Supplied at runtime via the DELIVERYLINE_MASTER_KEY env
    # var (.env / process env) — NEVER committed here. Blank is allowed at bind time (the property is
    # blank-tolerant, not @Validated); the fail-fast lives in CredentialMasterKeyGuard, which aborts
    # boot ONLY when the key is missing AND at least one project_credentials row exists. With no
    # credentials present (greenfield/test) the app boots key-less. Mirrors the linear.api-token /
    # github.token env-var indirection pattern.
    master-key: ${DELIVERYLINE_MASTER_KEY:}
  linear:
    # Story 1.14 — the API token is supplied at runtime via the LINEAR_API_TOKEN env var (.env /
    # process env) — NEVER committed here. Blank is allowed at bind time and is fatal only when the
    # linear-real profile activates the linearRestClient bean. Mirrors the github.token pattern below.
    api-token: ${LINEAR_API_TOKEN:}
    base-url: https://api.linear.app/graphql
    poll-interval-ms: 60000
    poll-batch-size: 50
    stale-threshold-multiplier: 2.0
    # Story 3a.4 — OPTIONAL intake poll-scoping. A Linear "workspace" is determined by the API
    # token (LINEAR_API_TOKEN), NOT a filterable field — so these scope intake to a team/project
    # *within* the token's workspace. Both absent ⇒ poll the whole token-scoped workspace
    # (byte-identical to the original behavior). Poll-path only; the fetch-by-reference path is
    # already scoped by the ticket reference's own team key.
    # team-key:   # e.g. FIN — scope intake to one Linear team key
    # project-id: # e.g. a Linear project UUID — scope intake to one project
    # Story 3a.5 — OPTIONAL opt-in auto-ingest. When enabled, the poll auto-creates a governed run
    # (via the same submit the CLI/REST use) for each ticket whose Linear ISSUE WORKFLOW-STATE ID
    # (issue.state.id, configured under Team → Settings → Workflow) is in `status-ids` AND that has no
    # existing active link. Get the ids via the `workflowStates` GraphQL query (UUIDs are per-team +
    # stable across renames). Default OFF ⇒ the poll stays a watcher. An enabled flag with an EMPTY
    # status-ids list ingests NOTHING (never the whole workspace).
    # auto-ingest:
    #   enabled: false
    #   status-ids: []      # e.g. ["e7f3...-uuid"] — Linear issue workflow-state IDs to ingest (e.g. "Ready for Planning")
    timeout:
      connect-ms: 5000
      read-ms: 30000
    polling:
      enabled: true
  github:
    # Story 3.14 — real GitHub adapter config (active only under the opt-in github-real profile,
    # which is NEVER in a profile group; the mock stays the default). The PAT is supplied at
    # runtime via the GITHUB_TOKEN env var (.env / process env) — NEVER committed here. Only the
    # non-secret knobs carry defaults; a blank token is allowed at bind time and is fatal only when
    # the github-real profile activates the gitHubRestClient bean.
    token: ${GITHUB_TOKEN:}
    base-url: https://api.github.com
    api-version: "2022-11-28"
    # AC5 — WARN when X-RateLimit-Remaining drops below this; raise GITHUB_RATE_LIMITED at 0.
    rate-limit-warn-threshold: 100
    timeout:
      connect-ms: 5000
      read-ms: 30000
  runner:
    stale-threshold-multiplier: 2.0
    timeout-scan-interval-ms: 10000
    timeout-scan-batch-size: 50
    # Story 3.2 — separate cadence for the heartbeat-stale + orphan-flip scan (stale-detection is
    # a slower-changing signal than timeout enforcement, OQ-7).
    stale-scan-interval-ms: 60000
    # Story 3.2 — bind the previously implicit poll cadence so RunnerProperties owns it.
    poll-interval-ms: 5000
    # Story 3.17a (AC4) — RunnerExecutionQueue backpressure cap: max rows in status='queued' at once.
    # enqueue beyond this raises RUNNER_QUEUE_FULL (503, retryable) and writes no row. Clamped to >=1.
    # The queue is dormant in 3.17a (no production caller); story 3.17b's worker pool drains it.
    queue-max-depth: 100
    # Story 3.17b (AC1/AC6/AC10) — RunnerWorkerPool: the bounded ThreadPoolTaskExecutor that drains
    # the queue. `enabled` is the master switch (ON in production; OFF in the test profile so an
    # always-on pool never dequeues during unrelated @SpringBootTests — Trap T8). `size` = worker
    # thread count (core=max; default 2, clamped 1..32). `backoff` is the idle worker poll window
    # (starts at initial, doubles to max, resets on work) — LISTEN/NOTIFY shortens idle latency below
    # this, the backoff is the always-correct liveness floor (Decision D8).
    worker-pool:
      enabled: true
      size: 2
      backoff:
        initial: 1s
        max: 10s
    stage-timeouts:
      investigation: 600s
      execution: 600s
    # Story 3a-1 — spec-stage orchestration. `kind` (AC10) selects the runner image dispatched for
    # the spec-investigation stage (codex | claude). `auto-dispatch` is the master switch for the
    # submit→dispatch and reject→re-dispatch triggers; ON in production, OFF in the test profile
    # (mirrors scheduling.enabled) so the existing suite stays deterministic.
    spec-stage:
      kind: codex
      auto-dispatch: true
    # Story 3.11 — plan-stage (EXECUTION) orchestration. `kind` (AC10) selects the runner image for
    # the implementation-plan stage (codex | claude; also serves pr-output until story 3.12).
    # `auto-dispatch` gates the approveSpec→dispatchPlanGeneration trigger; ON in production, OFF in
    # the test profile so the existing suite stays deterministic (Trap T11).
    plan-stage:
      kind: codex
      auto-dispatch: true
    # Story 3.12 — implementation-stage (pr-output) orchestration. `kind` (AC1) selects the runner
    # image for the pr-output sub-stage (codex | claude). OQ-4: it MUST stay equal to plan-stage.kind
    # until a runner_kind column lands, so the story-3.5 secret-scan (keyed on
    # kindForStage(EXECUTION)=plan-stage.kind) stays consistent. `auto-dispatch` gates the
    # dispatchImplementation/retryImplementation entry points; ON in production, OFF in the test
    # profile so the existing suite stays deterministic (Trap T7).
    implementation-stage:
      kind: codex
      auto-dispatch: true
    # Story 3a-8 — opt-in OpenSpec authoring. When enabled, the runner entrypoints author OpenSpec
    # change artifacts (proposal/specs/design/tasks) and assemble openspec/changes/<id>/ into the
    # delivered PR at pr-output; surfaced to the container as env DELIVERYLINE_RUNNER_OPENSPEC=true.
    # Default OFF (commented out) ⇒ runners are byte-identical to today. OPTIONAL + UNVALIDATED, so
    # the shared test application.yml needs no mirror entry. Uncomment + set true to opt in.
    # openspec:
    #   enabled: true
    # Story 3h-1 (FR75) — pre-review build-validation stage. When enabled AND a command is set, the
    # produced code is built backend-side (ProcessBuilder in the materialized host workspace, behind
    # BuildCommandPort) before push + review; a non-zero exit drives a bounded auto-fix loop
    # (build-fix-max-loops above). timeout bounds the build process (kill → non-zero on overrun).
    # Default OFF (commented out) ⇒ byte-identical to pre-3h (BUILD skipped entirely). OPTIONAL +
    # UNVALIDATED, so the shared test application.yml needs no mirror entry. Seeds the default
    # project's per-project build config; per-project overrides live on the Project aggregate.
    # build-stage:
    #   enabled: true
    #   command: "mvn -q -DskipTests package"
    #   timeout: 10m
    # Story 3h-2 (FR76) — pre-review CPU lint gate. When enabled AND commands are set, the produced
    # code is linted backend-side (each command via BuildCommandPort in the materialized host
    # workspace) AFTER a successful BUILD and BEFORE push + review; a command whose exit signals
    # critical findings parks the run at WaitingForLintApproval for operator approve_lint /
    # request_lint_fix (the latter re-dispatches EXECUTION, bounded by lint-fix-max-loops above).
    # timeout bounds each lint process (kill → non-zero on overrun). Default OFF (commented out) ⇒
    # byte-identical to pre-3h-2 (LINT skipped entirely). OPTIONAL + UNVALIDATED, so the shared test
    # application.yml needs no mirror entry. Seeds the default project's per-project lint config;
    # per-project overrides live on the Project aggregate.
    # lint-stage:
    #   enabled: true
    #   commands:
    #     - "mvn -q -DskipTests checkstyle:check"
    #     - "npm --prefix frontend run lint"
    #   timeout: 5m
    recovery:
      batch-size: 100
    mock:
      default-scenario:
        investigation: happy-spec
        execution: happy-implementation-plan
    scheduling:
      enabled: true
    # Story 3.6 AC4 — when true, captured runner logs that the redaction pass found to contain zero
    # secrets (both streams) may be elevated from local-only to shareable-redacted. Default false:
    # logs stay local-only (never shipped by story 3.7's ELK filter) unless explicitly opted in.
    allow-shareable-logs: false
    # Story 3.5 Trap T2 — per-kind agent-provider env-var NAMES (never values). Stories 3.3/3.4
    # read these names; RunnerSecretsService resolves the matching values from .env / process env
    # at dispatch time and injects each under the name it was found. NAMES ONLY here — putting a
    # secret VALUE in application.yml is forbidden (AC2). Codex is subscription-first/file-based
    # (story 3a-3): CODEX_AUTH_JSON (the raw single-line content of $CODEX_HOME/auth.json from a
    # ChatGPT/Pro subscription — the cost-saving path) is preferred; the entrypoint materializes it
    # into $CODEX_HOME/auth.json before invoking Codex. CODEX_API_KEY then OPENAI_API_KEY (aliases
    # for the same OpenAI key) remain the fallback. Claude is dual-mode (story 3.4):
    # CLAUDE_CODE_OAUTH_TOKEN (Pro/Max subscription token, preferred) then ANTHROPIC_API_KEY (API
    # billing) — two distinct credential types; doctor PASSes on either.
    secret-env-names:
      codex:
        - CODEX_AUTH_JSON
        - CODEX_API_KEY
        - OPENAI_API_KEY
      claude:
        - CLAUDE_CODE_OAUTH_TOKEN
        - ANTHROPIC_API_KEY
    # Story 3.1 — Docker runner adapter config. Bound to RunnerProperties.Docker.
    # Activated only under the runners.docker profile (the wiring is profile-gated;
    # leaving this block in the shared application.yml keeps the defaults discoverable
    # without making them load-bearing under the default runners.mock activation).
    docker:
      default-kind: codex
      image-tags:
        codex: deliveryline/codex-runner:latest
        claude: deliveryline/claude-runner:latest
      workspace-root: ${deliveryline.home:./}/runner-work
      workspace-retention-hours: 24
      # Story 3.2 — fixed-delay between RunnerWorkspaceCleanupJob runs. Default 1h.
      workspace-cleanup-interval-ms: 3600000
      container-create-timeout: 30s
      container-start-timeout: 30s
      # Story 3.8 — Docker network mode for runner containers. Default "none" (RunnerProperties.Docker)
      # is the locked-down posture: a mock/contract runner needs no egress. Real agent runs invoke the
      # codex/claude CLI, which MUST reach its provider API, so production allows egress. "bridge" =
      # default NAT egress (simplest); for tighter control, pre-create an egress-allowlisted Docker
      # network and name it here instead. Tests/contract tiers omit this key → bind the "none" default.
      network-mode: bridge
      # Docker security options applied at container create (HostConfig.withSecurityOpts). Codex's
      # read-only sandbox (spec/implementationPlan stages) runs every command through bubblewrap,
      # which must create an unprivileged USER NAMESPACE; Docker's default seccomp profile blocks
      # that syscall, so real read-only-stage runs fail with "bwrap: No permissions to create a new
      # namespace" and the agent can never read /workspace/repo. seccomp=unconfined permits it (the
      # container is still non-root, with backend-controlled network + read-only input mount). Omit
      # the key (empty default) to keep the locked-down posture for mock/contract tiers.
      security-opts:
        - seccomp=unconfined
      # Story 3.2a AC4 — grace window during which a labelled-but-rowless container is preserved by
      # the dangling-container sweep, so a container in the dispatch→row-insert window is never
      # destroyed. 0 disables the guard.
      dangling-container-min-age-seconds: 120
