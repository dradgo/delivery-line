# Story 3.7 (AC3 / AC4 / AC5) — DeliveryLine Logstash pipeline.
#
# Two ingest paths, one uniform classification filter, a defense-in-depth second redaction pass,
# then Elasticsearch.
#
#   AC3(a) TCP/JSON  — the backend's observability-gated LogstashTcpSocketAppender (logback-spring.xml)
#                      ships structured Spring Boot logs here as json_lines on port 5044.
#   AC3(b) file      — the D5 fail-closed runner-log ingest. The backend's RunnerLogShippingService
#                      only ever writes shareable-redacted-and-above NDJSON envelopes into the mounted
#                      ingest dir (local-only never reaches it), so this input cannot see an
#                      unshippable log by construction.
#
# AC4: a uniform `if [classification] == "local-only" { drop {} }` filter — belt-and-braces for the
# TCP path (app logs normally carry no classification and pass through; a doc explicitly tagged
# local-only is dropped before indexing).
#
# AC5 / Decision D6 / Trap T6: the gsub chain below mirrors the SAME secret categories as
# application/security/SensitivePayloadAnalyzer + RedactionCategory, so anything that slipped past
# source-side redaction (story 3.6) is still stripped before indexing. Each gsub maps to the matching
# [REDACTED_*] placeholder. Drift between this list and the Java RedactionCategory enum is caught by
# LogstashRedactionParityTest (it asserts every category placeholder appears here). Over-redaction is
# accepted — missing a real credential is the strictly worse failure mode.

input {
  tcp {
    port => 5044
    codec => json_lines
  }
  file {
    path => "/ingest/runner-logs/*.ndjson"
    codec => json
    mode => "read"
    sincedb_path => "/usr/share/logstash/data/sincedb-runner-logs"
  }
}

filter {
  # AC4 — classification-driven shipping. local-only is never indexed.
  if [classification] == "local-only" {
    drop {}
  }

  # AC5 / D6 — second-pass redaction mirroring SensitivePayloadAnalyzer categories.
  # Single-quoted patterns so regex backslashes are not re-interpreted by the Logstash config parser.
  mutate {
    gsub => [
      # GITHUB_TOKEN — github_pat_... and ghp_...
      "message", 'github_pat_[A-Za-z0-9_]{20,}', '[REDACTED_GITHUB_TOKEN]',
      "message", 'ghp_[A-Za-z0-9]{20,}', '[REDACTED_GITHUB_TOKEN]',
      # LINEAR_API_KEY
      "message", 'lin_api_[A-Za-z0-9]{20,}', '[REDACTED_LINEAR_API_KEY]',
      # AUTHORIZATION_HEADER — Bearer/Basic (whole header redacted; over-redaction is safe)
      "message", '(?i)Authorization\s*:\s*(?:Bearer|Basic)\s+\S+', 'Authorization: [REDACTED_AUTHORIZATION_HEADER]',
      # IDEMPOTENCY_KEY header
      "message", '(?i)Idempotency-Key\s*:\s*\S+', 'Idempotency-Key: [REDACTED_IDEMPOTENCY_KEY]',
      # PEM_CERTIFICATE_WITH_PRIVATE_KEY — must run before the standalone private-key pattern.
      # NOTE: Logstash mutate{gsub} compiles with JRuby/Joni (Ruby Regexp), where (?m) — not Java's
      # (?s) — is the dot-matches-newline flag; (?s) is a RegexpError. Replacement backreferences are
      # Ruby-style \1, not Java $1. Both are linted by LogstashRedactionParityTest.
      "message", '(?m)(?:-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----\s*)+-----BEGIN [A-Z ]*PRIVATE KEY-----.*?-----END [A-Z ]*PRIVATE KEY-----', '[REDACTED_PEM_CERTIFICATE_WITH_PRIVATE_KEY]',
      # SSH_PRIVATE_KEY — OpenSSH block
      "message", '(?m)-----BEGIN OPENSSH PRIVATE KEY-----.*?-----END OPENSSH PRIVATE KEY-----', '[REDACTED_SSH_PRIVATE_KEY]',
      # PEM_PRIVATE_KEY — RSA / EC / DSA / ENCRYPTED / generic PKCS#8
      "message", '(?m)-----BEGIN (?:RSA |EC |DSA |ENCRYPTED )?PRIVATE KEY-----.*?-----END (?:RSA |EC |DSA |ENCRYPTED )?PRIVATE KEY-----', '[REDACTED_PEM_PRIVATE_KEY]',
      # SSH_PUBLIC_KEY
      "message", 'ssh-(?:rsa|ed25519)\s+[A-Za-z0-9+/=._-]+', '[REDACTED_SSH_PUBLIC_KEY]',
      # QUERY_SECRET — ?token=/&apikey=/&access_token= (Ruby \1 backreference, not Java $1)
      "message", '(?i)([?&](?:token|apikey|access_token)=)[^&#\s]+', '\1[REDACTED_QUERY_SECRET]',
      # SECRET_FIELD — JSON secret-like fields (value redacted)
      "message", '(?i)("(?:secret|token|apiKey|api_key|accessToken|access_token|password|credential|linearApiKey|bearer|private|private_key|privateKey|refresh_token|refreshToken|client_secret|clientSecret|sessionToken|authToken|auth_token)"\s*:\s*")[^"]*"', '\1[REDACTED_SECRET_FIELD]"',
      # SECRET_FIELD (YAML form) — `key: value` secret-like fields. Mirrors
      # SensitivePayloadAnalyzer.YAML_SECRET_FIELD_PATTERN (snake_case/lowercase set) so a YAML-shaped
      # secret that slipped past source-side redaction is still stripped (parity gap closed in review).
      # Ruby ^/$ are always line-anchored, so (?i) alone matches Java's (?im) here.
      "message", '(?i)(\b(?:secret|token|api_key|access_token|password|credential|bearer|private|private_key|refresh_token|client_secret|session_token|auth_token)\b\s*:\s*)[^\s\r\n]+', '\1[REDACTED_SECRET_FIELD]',
      # ENV_VALUE — SECRET/TOKEN/PASSWORD/... env assignments
      "message", '(?i)^([A-Z0-9_]*(?:SECRET|TOKEN|PASSWORD|CREDENTIAL|API_KEY|ACCESS_KEY|PRIVATE_KEY|BEARER|REFRESH_TOKEN|CLIENT_SECRET|SESSION_TOKEN|AUTH_TOKEN)[A-Z0-9_]*=).+$', '\1[REDACTED_ENV_VALUE]',
      # ENVIRONMENT_BLOCK — a dumped "Environment:" KEY=VALUE block ((?m) = Ruby dot-matches-newline)
      "message", '(?m)Environment:\R(?:[A-Z0-9_]+=.*(?:\R|$))+', '[REDACTED_ENVIRONMENT_BLOCK]',
      # LOCAL_PATH — Windows %USERPROFILE% and unix /Users//home home dirs
      "message", '(?i)[A-Z]:\\Users\\[^\\\r\n]+\\[^\r\n]*', '[REDACTED_LOCAL_PATH]',
      "message", '(?:/Users|/home)/[^/\s]+/[^\s]*', '[REDACTED_LOCAL_PATH]'
    ]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    # Daily index; bind the ILM policy via an index template (see infra/observability/README.md +
    # infra/observability/elasticsearch/ilm-policy.json).
    index => "deliveryline-logs-%{+YYYY.MM.dd}"
  }
}
