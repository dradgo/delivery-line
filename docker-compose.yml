name: deliveryline

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: deliveryline
      POSTGRES_USER: deliveryline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - deliveryline-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U deliveryline -d deliveryline"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Story 3.3 — Codex runner image build target. This is a build-only,
  # one-shot runner image launched per-execution by the backend
  # DockerRunnerAdapter (story 3.1) with the workspace mounts + --network=none,
  # NOT a long-running compose service. The "runners" profile keeps it out of
  # the default `docker compose up` (postgres stays the only runtime service);
  # `docker compose build codex-runner` still rebuilds it by name.
  codex-runner:
    profiles: ["runners"]
    build:
      context: .
      dockerfile: runners/codex/Dockerfile
    image: deliveryline/codex-runner:latest

volumes:
  deliveryline-postgres-data:
