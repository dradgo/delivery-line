name: deliveryline

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: deliveryline
      POSTGRES_USER: deliveryline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - deliveryline-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U deliveryline -d deliveryline"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Story 3.3 — Codex runner image build target. This is a build-only,
  # one-shot runner image launched per-execution by the backend
  # DockerRunnerAdapter (story 3.1) with the workspace mounts + --network=none,
  # NOT a long-running compose service.
  #
  # The "runners" profile keeps it out of the default `docker compose up`:
  # Spring Boot 4's docker-compose autoconfig (doctor-smoke, jar-smoke) runs
  # `docker compose up --wait` against this file, and a one-shot runner that
  # exits non-zero would fail that wait and abort app startup. Profiles are the
  # only per-service exclusion Spring Boot's compose lifecycle honors.
  #
  # Still buildable without activating the profile — `docker compose build
  # codex-runner` (by name) builds it; rebuild BOTH at once with
  # `docker compose --profile runners build` (AC5 / AR24).
  codex-runner:
    profiles: ["runners"]
    build:
      context: .
      dockerfile: runners/codex/Dockerfile
    image: deliveryline/codex-runner:latest

  # Story 3.4 — Claude runner image build target (the Claude twin of
  # codex-runner). Same build-only, one-shot, profile-gated posture (see the
  # codex-runner note above for why the "runners" profile is required).
  # `docker compose build claude-runner` builds it by name; `docker compose
  # --profile runners build` rebuilds BOTH runner images (AC5).
  claude-runner:
    profiles: ["runners"]
    build:
      context: .
      dockerfile: runners/claude/Dockerfile
    image: deliveryline/claude-runner:latest

  # Story 3.7 — ELK observability stack (Elasticsearch + Logstash + Kibana),
  # gated behind the "observability" profile so it stays out of the default
  # `docker compose up -d` AND out of Spring Boot 4's docker-compose autoconfig
  # `up --wait` (doctor-smoke / jar-smoke) — exactly the rationale documented on
  # the codex-runner block above. AR25: the backend runs byte-for-byte
  # identically with or without this profile; ELK is NEVER required for normal
  # MVP operation, tests, or recovery. `scripts/start-all.{ps1,sh}` already pass
  # `--profile observability up -d` (story 1.17), so they bring this up.
  #
  # See docs/adr/0023-elk-replaces-loki.md and infra/observability/README.md.
  # Linux note: Elasticsearch needs `vm.max_map_count=262144` on the host
  # (docs/setup-local.md). Image versions are pinned (AC12 / Trap T10).
  elasticsearch:
    profiles: ["observability"]
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      # Single-node dev cluster — no cluster discovery, security off (loopback-only
      # local stack, mirrors the no-auth REST posture of story 6.9). NOT for prod.
      discovery.type: single-node
      xpack.security.enabled: "false"
      # Heap is operator-tunable (AC10); default kept small so the stack fits an
      # 8 GB dev host. The doctor memory check WARNs below 8 GB total RAM.
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms512m -Xmx512m}
    ports:
      - "${ELASTIC_HOST_PORT:-9200}:9200"
    volumes:
      - deliveryline-elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s

  logstash:
    profiles: ["observability"]
    image: docker.elastic.co/logstash/logstash:8.15.3
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      # Disable the X-Pack monitoring pipeline + node monitoring for the local stack.
      XPACK_MONITORING_ENABLED: "false"
      LS_JAVA_OPTS: ${LOGSTASH_JAVA_OPTS:--Xms256m -Xmx256m}
    ports:
      # TCP/JSON ingest for the backend's observability-gated LogstashTcpSocketAppender (AC7).
      - "${LOGSTASH_HOST_PORT:-5044}:5044"
    volumes:
      # Pipeline definitions (deliveryline.conf). Logstash auto-loads *.conf here.
      - ./infra/observability/logstash/pipelines:/usr/share/logstash/pipeline:ro
      # D5 fail-closed runner-log ingest dir — read-only. The backend only ever
      # writes shareable-redacted-and-above envelopes here (local-only never
      # reaches it), so the file input cannot see an unshippable log.
      - ${DELIVERYLINE_HOME:-./deliveryline-data}/runner-logs-ingest:/ingest/runner-logs:ro

  kibana:
    profiles: ["observability"]
    image: docker.elastic.co/kibana/kibana:8.15.3
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "${KIBANA_HOST_PORT:-5601}:5601"

  # Story 3.19 — Prometheus + Grafana for runner-queue metrics, on the SAME optional
  # "observability" profile as ELK (AR25: never required for normal operation/tests/recovery).
  # Prometheus scrapes the backend's /actuator/prometheus (default target host.docker.internal:8080,
  # since the backend runs on the host; see infra/observability/prometheus/prometheus.yml). Image
  # versions are pinned (Trap T10 parity with the ELK blocks).
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.54.1
    extra_hosts:
      # Linux parity for the host.docker.internal scrape target (Docker Desktop provides it natively).
      - "host.docker.internal:host-gateway"
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - deliveryline-prometheus-data:/prometheus

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.2.0
    depends_on:
      - prometheus
    environment:
      # Local dev stack: anonymous viewer access, no login wall (mirrors the no-auth ELK posture).
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - deliveryline-grafana-data:/var/lib/grafana

volumes:
  deliveryline-postgres-data:
  deliveryline-elasticsearch-data:
  deliveryline-prometheus-data:
  deliveryline-grafana-data:
