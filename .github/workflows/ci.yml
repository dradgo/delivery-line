# .github/workflows/ci.yml
# Story 1.21 — Tiered CI pipeline implementing AR28's gate sequence.
#
# Tier order (AR28, _bmad-output/planning-artifacts/architecture.md:213):
#   format-static-checks
#     -> runner-contract-fixtures
#       -> frontend-build-tests
#         -> backend-unit-tests
#           -> backend-contract-tests
#             -> runner-image-compat
#               -> jar-packaging
#                 -> bundled-jar-smoke   (push:main only — AC8 cost control)
#                 -> export-redaction-verify
#                   -> foundation-gate    (placeholder — story 1.23 fills body)
#
# Story 1.17 doctor-smoke matrix job is preserved unchanged as the AC3
# "doctor-invoking smoke jobs" entrypoint and is also wired into foundation-gate.
#
# OS-matrix policy (AC3):
#   - Linux + Windows: format-static-checks, frontend-build-tests,
#                      backend-unit-tests.
#   - Linux only:      runner-contract-fixtures, backend-contract-tests, runner-image-compat,
#                      jar-packaging, bundled-jar-smoke, export-redaction-verify,
#                      doctor-smoke (was on both OSes in 1.17; collapsed to
#                      Ubuntu-only when 1.21 added a full-Spring-context boot
#                      that requires the compose-managed Postgres — Windows
#                      coverage tracked in deferred-work.md).
#     (Docker-backed Testcontainers + buildx require Linux; macOS/Windows
#      runner Docker is excluded for cost/flakiness — see AC3.)
#
# Flake policy (AC5): no blanket retries. Container-pull retries are scoped
# narrowly and inline-documented where used.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least-privilege token policy — workflow inherits read-only `GITHUB_TOKEN`.
# Individual jobs that need to publish (e.g. future release-readiness tiers)
# must escalate explicitly with their own `permissions:` block.
permissions:
  contents: read

# Cancel in-progress runs for the same PR/ref. Do NOT cancel `main` push
# runs — they feed bundled-jar-smoke release-readiness (AC8, Open Clarif. 7).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Tier 1: format-static-checks (Spotless + Checkstyle + SpotBugs)
  # OS matrix: Linux + Windows. Each plugin invoked as a separate Maven goal
  # for per-plugin log clarity (epics.md:981). Failure annotations include the
  # `mvn spotless:apply` self-fix hint.
  # ---------------------------------------------------------------------------
  format-static-checks:
    name: format-static-checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Spotless check
        id: spotless
        shell: bash
        run: ./mvnw -B -ntp -pl deliveryline-backend -am spotless:check

      - name: Spotless apply hint
        if: failure() && steps.spotless.outcome == 'failure'
        shell: bash
        run: echo "::error::Run \`./mvnw spotless:apply\` locally to fix formatting violations."

      - name: Checkstyle check
        id: checkstyle
        shell: bash
        # `compile` ensures the upstream reactor module compiles so backend's
        # classpath resolution succeeds — checkstyle:check, like spotbugs:check,
        # has requiresDependencyResolution=compile but no lifecycle phase, so
        # -am alone won't trigger upstream sibling compilation.
        run: ./mvnw -B -ntp -pl deliveryline-backend -am compile checkstyle:check

      - name: Checkstyle failure hint
        if: failure() && steps.checkstyle.outcome == 'failure'
        shell: bash
        run: echo "::error::Checkstyle violations above. Run \`./mvnw checkstyle:check\` locally for the full report at deliveryline-backend/target/checkstyle-result.xml."

      - name: SpotBugs check
        id: spotbugs
        shell: bash
        # spotbugs:spotbugs materializes target/spotbugs.html for the artifact
        # upload below; spotbugs:check fails the build on threshold violations.
        # `compile` is required: SpotBugs reads bytecode, and without it the
        # upstream reactor module (deliveryline-runner-contracts) never
        # compiles, so backend's dep resolution for runner-contracts:jar fails
        # before spotbugs:spotbugs can even start.
        run: ./mvnw -B -ntp -pl deliveryline-backend -am compile spotbugs:spotbugs spotbugs:check

      - name: SpotBugs failure hint
        if: failure() && steps.spotbugs.outcome == 'failure'
        shell: bash
        run: echo "::error::SpotBugs findings above. Run \`./mvnw spotbugs:gui\` locally to triage, or inspect deliveryline-backend/target/spotbugs.html in the uploaded artifact."

      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report-${{ matrix.os }}
          path: |
            deliveryline-backend/target/spotbugsXml.xml
            deliveryline-backend/target/spotbugs.html
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Tier 1.5: docs-link-check (story 1.22 AC8)
  # Runs lychee across docs/**/*.md + README.md. Two-pass policy:
  #   1. Internal-link pass (--exclude '^https?://')      -> FAIL the job on
  #      missing-file / broken-anchor links. Internal-link failures gate merges
  #      because the docs site must stay self-consistent.
  #   2. External-link smoke (--include '^https?://')     -> WARN-only via
  #      continue-on-error. Third-party rate limits and intermittent outages
  #      must not block PR merges; the JSON artifact captures the failures for
  #      operator follow-up.
  #
  # `.lycheeignore` at repo root silences known-flaky external URL patterns
  # (docs.docker.com redirect chains, GitHub anchor-link false positives).
  #
  # Tier slot: parallel with runner-contract-fixtures (both depend only on
  # format-static-checks). Wired into foundation-gate `needs:` chain so story
  # 1.23 picks it up automatically as a required tier.
  # ---------------------------------------------------------------------------
  docs-link-check:
    name: docs-link-check
    needs: [format-static-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Internal link check (FAIL on broken file/anchor)
        id: lychee-internal
        uses: lycheeverse/lychee-action@v2.8.0
        with:
          # `--exclude ^https?://` restricts the run to relative paths and
          # in-file anchors. Internal failures gate the build (AC8 contract).
          # File-list expanded explicitly (`docs/*.md docs/**/*.md`) because
          # `docs/**/*.md` alone may not match top-level `docs/*.md` files
          # under some glob implementations. The regex argument is unquoted
          # because lychee-action passes `args:` through `shlex.split()`,
          # which would otherwise leave literal single quotes on the regex
          # and silently match nothing.
          # The report path is passed via the `output:` input (NOT `--output` in
          # args): lychee-action v2.8.0 ships a default `output` input, and also
          # passing `--output` in args trips "'output' is set in args as well as in
          # the action configuration". `output:` is pinned to `${{ github.workspace }}`
          # so the JSON report lands where the artifact-upload step can resolve it.
          output: ${{ github.workspace }}/lychee-internal.json
          args: --no-progress --max-concurrency 4 --accept 200,206,429 --exclude ^https?:// --format json docs/*.md docs/**/*.md README.md
          fail: true

      - name: External link smoke (WARN on third-party outage)
        id: lychee-external
        continue-on-error: true
        uses: lycheeverse/lychee-action@v2.8.0
        with:
          # `--include ^https?://` restricts the run to http(s) URLs only.
          # External failures emit a workflow annotation but do not fail the
          # job — third-party outages and rate-limits must not block merges.
          # Same regex-unquoting, workspace-pin, and `output:`-vs-`--output` notes
          # as the internal pass.
          output: ${{ github.workspace }}/lychee-external.json
          args: --no-progress --max-concurrency 4 --accept 200,206,429 --include ^https?:// --format json docs/*.md docs/**/*.md README.md
          fail: false

      - name: Annotate external failures (WARN)
        if: always() && steps.lychee-external.outcome == 'failure'
        run: |
          echo "::warning::lychee external-link smoke reported failures; see docs-link-check-report artifact (lychee-external.json) for details. External failures are non-blocking by design (story 1.22 AC8 — third-party outages must not block merges)."

      - name: Upload lychee reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-link-check-report
          path: |
            ${{ github.workspace }}/lychee-internal.json
            ${{ github.workspace }}/lychee-external.json
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Tier 2: runner-contract-fixtures
  # Schema v1 fixture validation against RunnerContractValidator. Linux-only;
  # no Docker. Fast (<2 min target).
  # ---------------------------------------------------------------------------
  runner-contract-fixtures:
    name: runner-contract-fixtures
    needs: [format-static-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Validate runner contract fixtures
        run: ./mvnw -B -ntp -pl deliveryline-runner-contracts test

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runner-contract-fixtures-reports
          path: deliveryline-runner-contracts/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Tier 3: frontend-build-tests (story 2.1 — Vite + frontend-maven-plugin)
  #
  # Matrix: ubuntu-latest + windows-latest. macOS deferred per story 1.17
  # cross-platform support tier. A failure on either OS blocks every downstream
  # tier and foundation-gate per AC10.
  #
  # `mvn -pl deliveryline-frontend clean package` exercises the full pipeline:
  # Node install (module-local .frontend-node/) → npm ci → npm run build →
  # target/dist/. The frontend-maven-plugin installs its own Node (per story 2.1
  # spike-Q1 expectation), so no workflow-level `setup-node` step is needed —
  # ambient Node would risk PATH interference on Windows runners.
  # ---------------------------------------------------------------------------
  frontend-build-tests:
    name: frontend-build-tests (${{ matrix.os }})
    needs: [runner-contract-fixtures]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # Pin the npm cache to a workspace path so it resolves identically on both
    # ubuntu and windows runners. The default `~/.npm` is POSIX-only — on
    # windows-latest the npm cache lives at %LocalAppData%\npm-cache, so caching
    # `~/.npm` there would silently cache nothing and re-download every run.
    env:
      npm_config_cache: ${{ github.workspace }}/.npm-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Cache the module-local Node install + npm registry between runs.
      # Key includes node.version + npm.version pins (from deliveryline-frontend/pom.xml)
      # and the lockfile so a Node bump or dep change invalidates the cache cleanly.
      # npm cache path is the workspace-pinned npm_config_cache (cross-platform).
      - name: Cache frontend Node + npm
        uses: actions/cache@v4
        with:
          path: |
            deliveryline-frontend/.frontend-node
            ${{ github.workspace }}/.npm-cache
          key: frontend-node-${{ matrix.os }}-${{ hashFiles('deliveryline-frontend/pom.xml', 'deliveryline-frontend/package-lock.json') }}
          restore-keys: |
            frontend-node-${{ matrix.os }}-

      - name: Frontend build
        shell: bash
        run: ./mvnw -B -ntp -pl deliveryline-frontend clean package

      - name: Upload frontend build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-tests-reports-${{ matrix.os }}
          # Narrow upload to reports + logs; exclude the SPA bundle and node_modules
          # so retention quota isn't burned on artifacts that aren't review-relevant.
          path: |
            deliveryline-frontend/target/surefire-reports/
            deliveryline-frontend/target/failsafe-reports/
            deliveryline-frontend/target/*.log
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # frontend-e2e (story 2.27 — Playwright cross-browser + mobile E2E)
  #
  # AC8/AC9/AC12/S3: a SEPARATE job gated on frontend-build-tests (which runs the
  # Vitest unit/component/a11y/sanitization suite), so a fast Vitest failure
  # short-circuits BEFORE the slower browser job burns CI minutes. Each matrix leg
  # installs ONLY its own browser binaries (`npx playwright install --with-deps`),
  # kept OUT of the Maven clean-package path. The Galaxy S23+ mobile project runs as
  # its OWN matrix leg (review P5) — independent of the desktop chromium leg's
  # result — installing the chromium engine its device profile uses.
  #
  # AC11 flake control: `retries: 0` in playwright.config.ts — no blanket retry;
  # quarantined specs are `test.fixme` + justified, surfacing flakes, not masking.
  #
  # AC8 / OQ-3: the matrix uses the real `msedge` channel. If the Edge channel is
  # flaky on Linux, fall back to treating chromium as the Edge-engine proxy and
  # document the substitution here (Edge is Chromium-based).
  # ---------------------------------------------------------------------------
  frontend-e2e:
    name: frontend-e2e (${{ matrix.browser }})
    needs: [frontend-build-tests]
    # Review P5 — each leg is an independent matrix entry (browser engine to install
    # + Playwright project to run). The Galaxy S23+ mobile leg is its OWN entry (no
    # longer a conditional step on the chromium leg), so it runs even if desktop
    # chromium fails, and the gate keys on every leg's success separately.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { browser: chromium, project: chromium, install: chromium }
          - { browser: firefox, project: firefox, install: firefox }
          - { browser: webkit, project: webkit, install: webkit }
          - { browser: msedge, project: msedge, install: msedge }
          - { browser: mobile-galaxy-s23, project: mobile-galaxy-s23, install: chromium }
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: deliveryline-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: deliveryline-frontend/package-lock.json

      # `npm ci` honours the committed .npmrc (legacy-peer-deps=true) so it matches
      # the frontend-maven-plugin install (memory: frontend-ts6-legacy-peer-deps).
      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (${{ matrix.install }})
        run: npx playwright install --with-deps ${{ matrix.install }}

      - name: Build the SPA (E2E runs against the production bundle)
        run: npm run build

      - name: Run Playwright (${{ matrix.browser }})
        env:
          CI: 'true'
        run: npm run test:e2e -- --project=${{ matrix.project }}

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: deliveryline-frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Tier 4: backend-unit-tests
  # Surefire only — pure unit tests. Excludes @Tag(architecture|integration|
  # contract|known-failure). OS matrix: Linux + Windows.
  # ---------------------------------------------------------------------------
  backend-unit-tests:
    name: backend-unit-tests (${{ matrix.os }})
    needs: [frontend-build-tests]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Backend unit tests
        shell: bash
        run: ./mvnw -B -ntp -pl deliveryline-backend -am -DskipITs test

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-tests-reports-${{ matrix.os }}
          path: deliveryline-backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Tier 5: backend-contract-tests
  # Failsafe — ArchUnit + Testcontainers + contract + integration. Linux-only
  # (Testcontainers needs Docker). AC7: ArchUnit fails loudly via
  # ArchitectureBoundaryTest assertion messages.
  #
  # AC5: no blanket retries on Failsafe. If container-cold-start flakes are
  # observed, add a narrow retry on the container-pull step ONLY, with inline
  # justification — do NOT wrap test execution.
  #
  # OpenAPI snapshot drift check (Task 12, AC6) lives at the tail of this job
  # as a graceful no-op until story 6.9 wires springdoc.
  # ---------------------------------------------------------------------------
  backend-contract-tests:
    name: backend-contract-tests
    needs: [backend-unit-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Backend verify gate (coverage + ArchUnit + contract tests)
        id: backend-verify
        # Run the full backend `verify` lifecycle in the Linux/Testcontainers
        # tier: Surefire unit tests, Failsafe ArchUnit + contract + integration
        # tests, and the JaCoCo coverage gate (jacoco-check). Story 1.21
        # originally passed `-Dsurefire.skip=true` here to skip the unit tier,
        # but story 2.32 verification proved maven-surefire-plugin does not
        # honor that property in this build, so the flag was dropped — this job
        # runs the full verify shape, and that is now explicit rather than
        # depending on a no-op flag.
        run: ./mvnw -B -ntp -pl deliveryline-backend -am verify

      - name: Coverage gate failure hint
        if: failure() && steps.backend-verify.outcome == 'failure'
        shell: bash
        # Story 2.32 — the verify step above can fail for coverage, ArchUnit,
        # contract/integration tests, or OpenAPI drift. When the failure is a
        # JaCoCo threshold breach, the merged HTML report in the
        # backend-coverage-jacoco artifact pinpoints the under-covered class.
        run: echo "::warning::If the verify step failed on the JaCoCo coverage gate, open index.html in the backend-coverage-jacoco artifact to find the under-covered class. If it failed earlier for ArchUnit, contract/integration tests, or OpenAPI drift, triage that failure instead. See deliveryline-backend/README.md (Test Coverage)."

      # AC6 (story 6.9) — OpenAPI snapshot drift gate.
      # Drift is enforced deterministically by OpenApiSnapshotContractTest, which runs in the
      # `verify` step above: it boots the app, fetches /v3/api-docs, canonicalizes it (key-sorted,
      # "\n" line endings — platform-independent) and asserts byte-equality with the committed
      # backend/src/main/resources/openapi/openapi.json. (A standalone `springdoc:generate` cannot
      # run without a live app, so generation + diff are folded into the boot test instead.)
      # This step is a belt-and-suspenders guard that the snapshot file is committed at all.
      - name: OpenAPI snapshot committed
        if: always()
        run: |
          if [ -f deliveryline-backend/src/main/resources/openapi/openapi.json ]; then
            echo "OpenAPI snapshot present; drift enforced by OpenApiSnapshotContractTest in the verify step above."
          else
            echo "::error::Committed OpenAPI snapshot missing at deliveryline-backend/src/main/resources/openapi/openapi.json (story 6.9). Regenerate with -Dopenapi.snapshot.write=true and commit."
            exit 1
          fi

      - name: Upload failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-contract-tests-reports
          path: deliveryline-backend/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-jacoco
          path: deliveryline-backend/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Tier 6: runner-image-compat
  # Builds both FROM-scratch runner Dockerfiles (E1 placeholders; E3 fills
  # entrypoints) then re-runs RunnerContractValidatorTest against schema v1
  # fixtures — AC4 stub-contract-drift gate.
  # ---------------------------------------------------------------------------
  runner-image-compat:
    name: runner-image-compat
    needs: [backend-contract-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build codex runner image
        # Story 3.3 turned this into a real image whose Dockerfile uses repo-root
        # build context (COPY runners/codex/...; see the Dockerfile header). Build
        # from the repo root with -f, and bake the deterministic mock CLI
        # (INSTALL_CODEX_CLI=false) so the gate stays offline/deterministic — no
        # network npm install of @openai/codex. This is a build-shape + contract
        # re-validation gate, not a real-CLI test.
        run: docker build -f runners/codex/Dockerfile --build-arg INSTALL_CODEX_CLI=false -t deliveryline/runners-codex:ci .

      - name: Build claude runner image
        # Story 3.4 turned this into a real image whose Dockerfile uses repo-root
        # build context (COPY runners/claude/...; see the Dockerfile header). Build
        # from the repo root with -f, and bake the deterministic mock CLI
        # (INSTALL_CLAUDE_CLI=false) so the gate stays offline/deterministic — no
        # network npm install of @anthropic-ai/claude-code. This is a build-shape +
        # contract re-validation gate, not a real-CLI test.
        run: docker build -f runners/claude/Dockerfile --build-arg INSTALL_CLAUDE_CLI=false -t deliveryline/runners-claude:ci .

      - name: Re-validate runner contract fixtures against schema v1
        run: ./mvnw -B -ntp -pl deliveryline-runner-contracts -am test -Dtest='RunnerContractValidatorTest'

      - name: Upload validator reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runner-image-compat-reports
          path: deliveryline-runner-contracts/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Tier 7: jar-packaging
  # Spring Boot Maven plugin executable jar. Linux-only — Spring Boot's bundled
  # output is platform-agnostic. java -jar ... --help validates structural jar
  # without booting Postgres (Spring Shell exits 0 on --help).
  # ---------------------------------------------------------------------------
  jar-packaging:
    name: jar-packaging
    needs: [runner-image-compat]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Package executable jar
        run: ./mvnw -B -ntp -pl deliveryline-backend -am -DskipTests package

      - name: Verify jar is executable
        # Pin the glob — Spring Boot's `repackage` leaves a `*.jar.original`
        # next to the bootable jar; passing both to `java -jar` misparses.
        # `java -jar ... --help` boots the full Spring context (so the
        # transitive bean graph — services → repositories → mock adapters —
        # can wire). Spring's docker-compose autoconfig runs against the
        # repo-root docker-compose.yml; POSTGRES_PASSWORD interpolates the
        # ${POSTGRES_PASSWORD:?...} placeholder. DELIVERYLINE_HOME satisfies
        # the unguarded @Value("${deliveryline.home}") in DoctorProbeAdapter.
        # SPRING_PROFILES_ACTIVE=test activates `runners.mock,linear-mock`,
        # providing the LinearAdapter / RunnerAdapter beans that bean
        # creation transitively requires.
        env:
          POSTGRES_PASSWORD: deliveryline-ci
          DELIVERYLINE_HOME: ${{ github.workspace }}/.deliveryline-jar
          SPRING_PROFILES_ACTIVE: test
          # Disable background pollers + force non-interactive Spring Shell
          # so `java -jar ... --help` actually processes the --help arg and
          # exits, rather than booting into InteractiveShellRunner.
          DELIVERYLINE_RUNNER_SCHEDULING_ENABLED: "false"
          DELIVERYLINE_LINEAR_POLLING_ENABLED: "false"
          SPRING_SHELL_INTERACTIVE_ENABLED: "false"
          # Tomcat's non-daemon acceptor keeps the JVM alive after `help`
          # exits cleanly — disable the embedded web server for the CLI smoke
          # so the process terminates immediately on shell completion.
          SPRING_MAIN_WEB_APPLICATION_TYPE: none
        run: |
          set -o pipefail
          JAR=$(ls deliveryline-backend/target/deliveryline-backend-*.jar | grep -v '\.original$' | head -1)
          if [ -z "$JAR" ]; then
            echo "::error::No bootable jar produced under deliveryline-backend/target/"
            ls -la deliveryline-backend/target/ || true
            exit 1
          fi
          echo "Booting $JAR"
          # Spring Shell's `help` is the built-in list-commands command; it
          # runs in the non-interactive runner and exits 0. `--help` does NOT
          # work here — Spring Shell treats it as a command name and throws
          # CommandNotFoundException. The NonInteractiveShellRunner does not
          # call System.exit(), and at least one bean (docker-compose
          # lifecycle / data layer) leaves a non-daemon thread running, so we
          # bound the JVM with `timeout` and assert success by grepping the
          # captured output for the AVAILABLE COMMANDS banner.
          LOG=$(mktemp)
          set +e
          timeout 240s java -jar "$JAR" help 2>&1 | tee "$LOG"
          rc=${PIPESTATUS[0]}
          set -e
          echo "java -jar raw exit: $rc"
          if grep -q "AVAILABLE COMMANDS" "$LOG" && grep -q "deliveryline doctor" "$LOG"; then
            echo "jar boots, shell registers commands"
            exit 0
          fi
          echo "::error::jar smoke output missing AVAILABLE COMMANDS / deliveryline doctor"
          exit 1

      - name: Upload packaged jar
        uses: actions/upload-artifact@v4
        with:
          name: jar-packaging-artifact
          path: deliveryline-backend/target/deliveryline-backend-*.jar
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Tier 8: bundled-jar-smoke
  # AC8 — runs only on push:main (release-readiness signal, cost control on
  # PRs). Boots Postgres via docker-compose, runs the packaged jar, invokes
  # `deliveryline doctor` against it. Tolerates WARN per 1.17 AC8 semantics.
  # ---------------------------------------------------------------------------
  bundled-jar-smoke:
    name: bundled-jar-smoke
    needs: [jar-packaging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_PASSWORD: deliveryline-ci
      DELIVERYLINE_HOME: ${{ github.workspace }}/.deliveryline-bundled
      # test profile group activates runners.mock,linear-mock so the bean
      # graph closes without external services.
      SPRING_PROFILES_ACTIVE: test
      DELIVERYLINE_RUNNER_SCHEDULING_ENABLED: "false"
      DELIVERYLINE_LINEAR_POLLING_ENABLED: "false"
      SPRING_SHELL_INTERACTIVE_ENABLED: "false"
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Download packaged jar
        uses: actions/download-artifact@v4
        with:
          name: jar-packaging-artifact
          path: deliveryline-backend/target/

      - name: Start Postgres via docker-compose
        run: |
          docker compose up -d postgres
          for i in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -U deliveryline -d deliveryline > /dev/null 2>&1; then
              echo "postgres ready"
              exit 0
            fi
            sleep 1
          done
          echo "postgres failed to become ready within 30s"
          docker compose logs postgres
          exit 1

      - name: Boot jar and verify REST smoke
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/deliveryline
          SPRING_DATASOURCE_USERNAME: deliveryline
          SPRING_DATASOURCE_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        run: |
          mkdir -p bundled-jar-smoke-logs
          APP_PORT="${SERVER_PORT:-8080}"
          # Exclude the pre-repackage *.jar.original and the -sources/-javadoc sidecars; a fresh
          # `package` produces exactly one bootable jar. Fail on >1 (e.g. a stale versioned jar
          # left by a build without `clean`) so the smoke never boots a non-deterministic target.
          mapfile -t JARS < <(ls deliveryline-backend/target/deliveryline-backend-*.jar 2>/dev/null \
            | grep -Ev '(\.original|-sources\.jar|-javadoc\.jar)$' || true)
          if [ "${#JARS[@]}" -eq 0 ]; then
            echo "::error::No bootable jar found at deliveryline-backend/target/"
            ls -la deliveryline-backend/target/ || true
            exit 1
          fi
          if [ "${#JARS[@]}" -gt 1 ]; then
            echo "::error::Multiple bootable jars found (non-deterministic): ${JARS[*]}. Run a clean build."
            exit 1
          fi
          JAR="${JARS[0]}"
          # Command path is `deliveryline doctor` — DoctorCommands has
          # @CommandGroup(prefix="deliveryline"). The NonInteractiveShellRunner
          # does not call System.exit and at least one bean holds a non-daemon
          # thread, so bound the JVM with `timeout` and assert success via the
          # JSON envelope (overallStatus). SIGTERM after a passing run is OK.
          java -jar "$JAR" > bundled-jar-smoke-logs/server.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true; wait "$APP_PID" 2>/dev/null || true' EXIT
          ready=""
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:${APP_PORT}/actuator/health" > bundled-jar-smoke-logs/health.json; then
              status=$(jq -r '.status // empty' bundled-jar-smoke-logs/health.json)
              if [ "$status" = "UP" ]; then
                ready=1
                break
              fi
            fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "::error::packaged jar exited before the REST surface became ready"
              tail -100 bundled-jar-smoke-logs/server.log || true
              exit 1
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "::error::packaged jar never became ready on http://127.0.0.1:${APP_PORT}"
            tail -100 bundled-jar-smoke-logs/server.log || true
            exit 1
          fi
          curl -fsS "http://127.0.0.1:${APP_PORT}/api/v1/workflows" \
            > bundled-jar-smoke-logs/workflows.json
          curl -fsS "http://127.0.0.1:${APP_PORT}/v3/api-docs" \
            > bundled-jar-smoke-logs/openapi.json
          jq -e '.status == "UP"' bundled-jar-smoke-logs/health.json > /dev/null
          jq -e '
            type == "array" and
            all(
              .[];
              (
                (keys | sort) ==
                  ["currentState", "lastEventAt", "lastEventType", "ticketRef", "workflowRunId"]
              ) and
              (.workflowRunId | type == "string") and
              (.currentState | type == "string") and
              ((.ticketRef == null) or (.ticketRef | type == "string")) and
              ((.lastEventAt == null) or (.lastEventAt | type == "string")) and
              ((.lastEventType == null) or (.lastEventType | type == "string"))
            )
          ' bundled-jar-smoke-logs/workflows.json > /dev/null
          jq -e '
            .paths["/api/v1/workflows"] and
            .paths["/api/v1/workflows/{workflowRunId}"] and
            .paths["/api/v1/workflows/{workflowRunId}/events"]
          ' bundled-jar-smoke-logs/openapi.json > /dev/null
          # ---------------------------------------------------------------------
          # Story 2.28 (AC7) — SPA serving + deep-link fallback round-trip through
          # the packaged jar. Send `Accept: text/html` so the fallback predicate
          # treats these as genuine browser navigations (an absent Accept also
          # qualifies, but being explicit documents intent).
          # ---------------------------------------------------------------------
          curl -fsS -H 'Accept: text/html' "http://127.0.0.1:${APP_PORT}/" \
            > bundled-jar-smoke-logs/root.html
          if ! grep -q '<div id="root">' bundled-jar-smoke-logs/root.html; then
            echo "::error::GET / did not serve the SPA shell (<div id=\"root\"> missing)"
            cat bundled-jar-smoke-logs/root.html || true
            exit 1
          fi
          curl -fsS -H 'Accept: text/html' "http://127.0.0.1:${APP_PORT}/some/spa/route" \
            > bundled-jar-smoke-logs/spa-route.html
          if ! grep -q '<div id="root">' bundled-jar-smoke-logs/spa-route.html; then
            echo "::error::GET /some/spa/route did not fall back to the SPA shell"
            cat bundled-jar-smoke-logs/spa-route.html || true
            exit 1
          fi
          # Story 2.28 (AC7/AC9) — an API path is NEVER masked by the SPA fallback:
          # a well-formed but absent run id returns 404 application/problem+json,
          # not the HTML shell. (A bare "nonexistent" id surfaces INVALID_ID_PREFIX
          # 400; use a run_-prefixed absent id so the probe exercises the
          # RUN_NOT_FOUND 404 path the AC names.)
          api_404=$(curl -s -o bundled-jar-smoke-logs/api-404.json \
            -w '%{http_code} %{content_type}' \
            -H 'Accept: application/json' \
            "http://127.0.0.1:${APP_PORT}/api/v1/workflows/run_smoke_absent_0001")
          echo "api not-found probe: ${api_404}"
          case "${api_404}" in
            "404 application/problem+json"*) : ;;
            *)
              echo "::error::GET /api/v1/workflows/<absent> expected '404 application/problem+json', got '${api_404}'"
              cat bundled-jar-smoke-logs/api-404.json || true
              exit 1
              ;;
          esac
          # Story 2.28 (AC9) — the documented read surface resolves to JSON, not
          # index.html, proving the SPA fallback ordering never shadows a real
          # endpoint. Content-type is the tell.
          wf_ct=$(curl -s -o /dev/null -w '%{content_type}' \
            -H 'Accept: application/json' \
            "http://127.0.0.1:${APP_PORT}/api/v1/workflows")
          case "${wf_ct}" in
            application/json*) : ;;
            *)
              echo "::error::GET /api/v1/workflows served '${wf_ct}', expected application/json (SPA fallback may be masking the endpoint)"
              exit 1
              ;;
          esac
          # Story 2.28 (AC9) — the bundled jar publishes EXACTLY the committed REST
          # surface (no endpoint silently dropped or masked by the fallback).
          # Compare the booted /v3/api-docs path-key set to the committed snapshot
          # rather than hand-enumerating, so this stays drift-proof as Epic 3+ adds
          # endpoints. The checkout step makes the snapshot available on disk.
          jq -S '.paths | keys' bundled-jar-smoke-logs/openapi.json \
            > bundled-jar-smoke-logs/booted-paths.json
          jq -S '.paths | keys' \
            deliveryline-backend/src/main/resources/openapi/openapi.json \
            > bundled-jar-smoke-logs/snapshot-paths.json
          if ! diff -u bundled-jar-smoke-logs/snapshot-paths.json bundled-jar-smoke-logs/booted-paths.json; then
            echo "::error::booted REST path set diverges from the committed openapi.json snapshot (endpoint dropped or masked in the bundled jar)"
            exit 1
          fi

      - name: Tear down docker-compose
        if: always()
        run: docker compose down -v

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundled-jar-smoke-logs
          path: bundled-jar-smoke-logs/
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Tier 9: export-redaction-verify
  # Until stories 5.1–5.4 land the export service, this tier exercises the
  # redaction-policy contract tests and asserts deterministic-redaction unit
  # tests are green. Story 5.1 will extend to bundle-level redaction checks.
  # ---------------------------------------------------------------------------
  export-redaction-verify:
    name: export-redaction-verify
    needs: [jar-packaging]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Redaction policy + logging redaction contract tests
        # Story 2.24 AC8 — extended to cover the new RedactionPolicyParityContractTest
        # (backend ↔ runner-contracts JSON parity, AC16) and the schema-side
        # RedactionPolicyContractTest in deliveryline-runner-contracts. The
        # cross-side drift test runs as the second step below.
        run: |
          ./mvnw -B -ntp -pl deliveryline-backend -am test \
            -Dtest='*RedactionContractTest,*RedactionPolicyService*Test,*RedactionPolicy*ContractTest,RedactingMessageConverterUnitTest' \
            -Dsurefire.failIfNoSpecifiedTests=false

      - name: Runner-contracts redaction-policy schema contract test
        # Story 2.24 AC16 — schema validation of the canonical
        # runner-contracts/redaction-policy.json. A drift in either direction
        # fails CI.
        run: |
          ./mvnw -B -ntp -pl deliveryline-runner-contracts test \
            -Dtest='RedactionPolicyContractTest' \
            -Dsurefire.failIfNoSpecifiedTests=false

      - name: Set up Node.js for the frontend drift contract test
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Frontend redaction-policy mirror drift contract test
        # Story 2.24 AC16 (P3, code-review 2026-05-26) — the frontend mirror at
        # deliveryline-frontend/src/lib/sanitization/redaction-policy.generated.json
        # MUST be byte-for-byte identical to the canonical runner-contracts copy.
        # If this test fails, run `scripts/regen-redaction-policy.sh` from repo
        # root and commit both files together.
        working-directory: deliveryline-frontend
        run: |
          npm ci
          npx vitest run src/lib/sanitization/__tests__/redaction-policy-drift.test.ts

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export-redaction-verify-reports
          path: deliveryline-backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Story 1.17 doctor-smoke — preserved unchanged. Anchors AC3's "doctor-invoking
  # smoke jobs" entry. Wired into foundation-gate alongside the 9 new tiers.
  # ---------------------------------------------------------------------------
  # Ubuntu-only — the doctor command boots a full Spring context, and the
  # transitive bean graph (WorkflowCommands → services → repositories) requires
  # the persistence layer. Spring Boot 4's docker-compose autoconfig starts
  # the docker-compose.yml-defined Postgres before bean creation, giving JPA a
  # real DB to wire against. Windows runners have no Docker; the
  # DOCTOR_DOCKER_MISSING WARN-tolerance coverage from the original 1.17 matrix
  # is deferred to a follow-up that decouples doctor from the persistence
  # bean graph (see deferred-work.md).
  doctor-smoke:
    name: doctor-smoke (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Required to interpolate the compose file's ${POSTGRES_PASSWORD:?...}
      # placeholder — Spring docker-compose autoconfig runs `docker compose
      # config --format=json` early in startup and fails the whole boot if the
      # var is missing.
      POSTGRES_PASSWORD: deliveryline-ci
      DELIVERYLINE_HOME: ${{ github.workspace }}/.deliveryline-doctor
      # `test` profile activates `runners.mock,linear-mock` (see
      # application.yml profile groups) — supplies LinearMockAdapter and
      # MockRunnerAdapter so the bean graph closes without external services.
      SPRING_PROFILES_ACTIVE: test
      # Disable background pollers so `mvnw spring-boot:run` exits as soon as
      # the doctor CLI command completes. Without these the scheduler /
      # Linear poller keep the JVM alive past timeout.
      DELIVERYLINE_RUNNER_SCHEDULING_ENABLED: "false"
      DELIVERYLINE_LINEAR_POLLING_ENABLED: "false"
      # Force non-interactive Spring Shell. By default Spring Shell starts
      # InteractiveShellRunner which waits for stdin (logs "Running in
      # interactive mode, arguments will be ignored") — the `doctor` command
      # passed via -Dspring-boot.run.arguments is dropped and the JVM never
      # exits. SPRING_SHELL_INTERACTIVE_ENABLED=false routes the args through
      # ScriptShellRunner / NonInteractiveShellRunner instead.
      SPRING_SHELL_INTERACTIVE_ENABLED: "false"
      # Disable the embedded web server: with spring-boot-starter-web on the
      # classpath, Spring Boot auto-detects WebApplicationType.SERVLET and
      # starts Tomcat, whose non-daemon acceptor thread keeps the JVM alive
      # after the shell command exits successfully. The CLI doctor flow does
      # not need HTTP, so disable web autodetection here.
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # docker-availability + supported-environment on ubuntu-latest PASS;
      # java-version PASS. Spring's docker-compose autoconfig (active because
      # docker-compose.yml is at the repo root and Docker is present) starts
      # Postgres before bean creation, so the full Spring context — including
      # JPA repos that WorkflowCommands transitively depends on — wires
      # cleanly. The Windows-runner DOCTOR_DOCKER_MISSING WARN coverage from
      # 1.17 AC8 is recorded in deferred-work.md.
      - name: Doctor smoke (Ubuntu)
        # NonInteractiveShellRunner returns from ApplicationRunner.run() but
        # does not call System.exit(); even with web disabled some bean (most
        # likely a spring-boot-docker-compose lifecycle thread) keeps the JVM
        # alive past the job's 15-min timeout. We bound the JVM lifetime with
        # `timeout` and assert success by grepping for the doctor JSON envelope
        # in the captured output. SIGTERM (124) after a successful run is
        # treated as success; any other non-zero exit fails the step.
        run: |
          set -o pipefail
          LOG=$(mktemp)
          set +e
          timeout 300s ./scripts/doctor.sh --only supported-environment,java-version,docker-availability --format json 2>&1 | tee "$LOG"
          rc=${PIPESTATUS[0]}
          set -e
          echo "doctor.sh raw exit: $rc"
          if grep -q '"overallStatus":"PASS"' "$LOG"; then
            echo "doctor PASS detected in output"
            exit 0
          fi
          echo "::error::doctor did not report overallStatus=PASS"
          exit 1

  # ---------------------------------------------------------------------------
  # foundation-gate (story 1.23 — aggregate Epic-1 contract verification).
  #
  # Required status check on `main` (per docs/ci-branch-protection.md). Runs
  # FoundationGateVerificationTest (10 @Nested classes, one per Epic-1
  # foundation contract) under the dedicated `foundation-gate` Maven profile.
  # Each nested class delegate-runs the source-of-truth contract test via the
  # JUnit Platform Launcher API; failure messages start with `[story X.Y]`
  # so CI logs point at the broken contract on first glance.
  #
  # On `pull_request` events, an additional step upserts a PR comment via
  # actions/github-script using the `<!-- foundation-gate-status -->` marker.
  # The comment is gated on changed-files: docs-only PRs are skipped to avoid
  # comment noise. `pull-requests: write` is escalated at the job level only.
  #
  # bundled-jar-smoke is intentionally NOT in needs: — it only runs on
  # push:main, and foundation-gate must succeed on PR runs.
  #
  # Story 2.28 (AC11/S6) — the packaging invariant is split across two tiers so
  # the gate widens to PRs WITHOUT moving the heavy runtime smoke onto PRs:
  #   • PACKAGING invariant (every PR): BundledJarPackagingContractTest unzips the
  #     repackaged jar and asserts the embedded SPA (BOOT-INF/classes/static/...).
  #     It runs inside backend-contract-tests (already in needs: above, via the
  #     `mvn verify` Failsafe tier), so a jar missing the embedded SPA reds every
  #     PR at this gate.
  #   • RUNTIME round-trip (push:main only): bundled-jar-smoke boots the jar and
  #     curls the SPA + REST surface. It stays the release-readiness signal (AC8
  #     cost control) and is deliberately NOT a foundation-gate need — adding it
  #     would mark the gate skipped on PRs (the job is conditional on push:main).
  # ---------------------------------------------------------------------------
  foundation-gate:
    name: foundation-gate
    # `if: always() && !cancelled()` ensures this job runs even when one of its
    # needs is `failure` or `skipped`, so the assertion step below can convert
    # those outcomes into an explicit fail. Without this, a matrix tier failing
    # on a single OS would mark foundation-gate `skipped`, which some
    # branch-protection configurations treat as success — silently unblocking
    # merges despite a failed tier.
    if: ${{ always() && !cancelled() }}
    needs:
      - format-static-checks
      - docs-link-check
      - runner-contract-fixtures
      - frontend-build-tests
      # Story 2.27 (AC13/S5) — widen the foundation gate to "frontend test suite
      # green on the branch": frontend-build-tests already enforces the Vitest half;
      # frontend-e2e adds the Playwright cross-browser + keyboard-only + mobile
      # regressions, so they block on PRs at the same gate as backend regressions.
      - frontend-e2e
      - backend-unit-tests
      - backend-contract-tests
      - runner-image-compat
      - jar-packaging
      - export-redaction-verify
      - doctor-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Workflow-root permissions stay `contents: read`. This job escalates
    # ONLY `pull-requests: write` so the PR-comment upsert step can run.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Assert all required tiers succeeded
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          echo "needs: $NEEDS_JSON"
          # Fail if any required tier ended in anything other than 'success'.
          # This converts skipped/failure/cancelled into an explicit exit 1 so
          # branch protection treats foundation-gate as failed in all those
          # cases.
          failures=$(echo "$NEEDS_JSON" | jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"')
          if [ -n "$failures" ]; then
            echo "::error::foundation-gate failing — non-success tiers detected:"
            echo "$failures"
            exit 1
          fi
          echo "All prerequisite tiers reported success."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Docker daemon is reachable (env-vs-contract disambiguation)
        # If Docker is unavailable, Testcontainers throws ContainerLaunchException
        # mid-test and the aggregate report blames a contract regression. Surface
        # an env-level failure here with an explicit `[env]` marker so triage is
        # unambiguous. Matches the `[story X.Y]` convention used by the aggregator
        # for contract failures.
        run: |
          if ! docker info >/dev/null 2>&1; then
            echo "::error::[env] Docker daemon not reachable — Testcontainers cannot start. This is an infrastructure issue, NOT a foundation-contract regression. Re-run the job; if it persists, escalate to CI ops."
            exit 1
          fi
          echo "[env] Docker daemon reachable: $(docker version --format '{{.Server.Version}}')"

      - name: Run FoundationGateVerificationTest
        env:
          # Testcontainers + Flyway need a Postgres password placeholder for
          # Spring docker-compose autoconfig; matches the jar-packaging job.
          POSTGRES_PASSWORD: deliveryline-ci
          SPRING_PROFILES_ACTIVE: test
        run: |
          # Run the `verify` LIFECYCLE (not isolated failsafe goals). Isolated
          # `failsafe:integration-test` invocation has three fatal gaps in a clean
          # CI checkout, all proven against a fresh empty local Maven repo:
          #   - it never `package`s the upstream `-am` modules, so backend can't
          #     resolve `deliveryline-runner-contracts:jar` ("Could not find
          #     artifact ...");
          #   - it skips lifecycle-bound `jacoco:prepare-agent`, leaving failsafe's
          #     `<argLine>@{argLine} ...</argLine>` literal → JVM fork crash
          #     ("forked VM terminated without properly saying goodbye");
          #   - it aborts on reactor modules with no matching test.
          # The `verify` phase packages the upstream jars, binds prepare-agent, and
          # the `-Pfoundation-gate` profile pins failsafe `<groups>foundation-gate</groups>`
          # so only the foundation contracts gate here. `failIfNoSpecifiedTests=false`
          # keeps non-matching reactor modules from aborting the run. (Surefire unit
          # tests also run as part of `verify` — redundant with backend-unit-tests
          # but harmless; tightening that is a story-1.23 follow-up.)
          ./mvnw -B -ntp -pl deliveryline-backend -am -Pfoundation-gate verify \
            -Dit.test='*FoundationGateVerificationTest*' \
            -Dfailsafe.failIfNoSpecifiedTests=false

      - name: Upload foundation-gate test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-gate-reports
          path: deliveryline-backend/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Detect non-docs changed files on PR
        id: changed-files
        if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' }}
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              { owner, repo, pull_number, per_page: 100 }
            );
            // Non-docs surfaces — keep in sync with story 1.23 AC9. A PR whose
            // changed files all fall outside these prefixes is "docs-only" and
            // skips the comment.
            const codePrefixes = [
              'deliveryline-backend/',
              'deliveryline-frontend/',
              'deliveryline-runner-contracts/',
              'runners/',
            ];
            const codeFiles = new Set();
            const hasCode = files.some(f =>
              codePrefixes.some(p => f.filename.startsWith(p)) ||
              codeFiles.has(f.filename)
            );
            core.setOutput('has-code', hasCode ? 'true' : 'false');

      - name: Upsert foundation-gate PR status comment
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && steps.changed-files.outputs.has-code == 'true' && always() }}
        uses: actions/github-script@v7
        env:
          GATE_STATUS: ${{ job.status }}
        with:
          script: |
            // Deterministic marker — story 1.23 AC9 — used to find a previous
            // comment so this step UPSERTs (edits in place) rather than spams.
            const marker = '<!-- foundation-gate-status -->';
            const gateStatus = process.env.GATE_STATUS;
            const body = gateStatus === 'success'
              ? `${marker}\nFoundation gate **passing** on this branch — safe to merge after normal review.\n\nThis comment is generated by .github/workflows/ci.yml (foundation-gate job, story 1.23 AC9). It updates in place on each run.`
              : `${marker}\nFoundation gate **FAILING** — see the \`foundation-gate\` job log. This PR cannot merge until the failing contract is fixed.\n\nThe failure message in the job log starts with \`[story X.Y]\` so the broken Epic-1 contract is identified on first glance.`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
              core.info(`Updated existing foundation-gate comment ${existing.id}.`);
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
              core.info('Created new foundation-gate comment.');
            }

  # ===========================================================================
  # Side-tier: REAL runner-image build + self-test + real-runner contract IT
  # Story 3.34. Closes the story-3.8 deferrals D1/D8/D10 (the dedicated
  # `runner-image-build` + `runner-contract-real` CI jobs and the foundation-gate
  # widening) and the 3.7 `docker-runner-it` Maven-profile CI wiring.
  #
  # These three jobs are a PATH-TRIGGERED side-tier hanging off `detect-changes`;
  # they are intentionally NOT in `foundation-gate.needs` (R7/OQ-1 — adding a
  # path-skipped job there would red every docs-only PR because the gate converts
  # skip→fail). Merge-blocking is realized by the always-runs
  # `runner-contract-real-gate` aggregator + a branch-protection required check
  # (see docs/ci-branch-protection.md).
  #
  # Division of labor vs the EXISTING every-PR `runner-image-compat` tier (kept,
  # complementary): compat builds OFFLINE mock images (INSTALL_*_CLI=false) and
  # re-validates the schema-v1 contract, cheaply, on every PR. This tier builds
  # the REAL images (INSTALL_*_CLI=true → network npm install of @openai/codex,
  # @anthropic-ai/claude-code, @fission-ai/openspec) via compose, runs the REAL
  # image `--self-test`, and runs the heavy end-to-end RealRunnerContractIT — only
  # when runner paths change (or on push:main). See story 3.34 Reconciliation 11.
  #
  # Linux-only (Docker-backed; story 1.21 AC3). Least-privilege token: only the
  # detect-changes / gate jobs touch the PR API, and only the gate escalates
  # `pull-requests: write` (at job level). All build/test jobs stay read-only.
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # detect-changes — cheap path-trigger gate (AC2, AC9; R3, R9)
  # Mirrors the foundation-gate "Detect non-docs changed files on PR" step but
  # emits a single `runner-paths-changed` output the three heavy jobs guard on.
  # NOT `on.paths` — ci.yml must keep running every PR (it carries foundation-gate),
  # so per-job `if:` guards are the only correct path filter here.
  # ---------------------------------------------------------------------------
  detect-changes:
    name: detect-changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Read-only PR-files listing. Root token is `contents: read`; listing PR
    # files needs `pull-requests: read`.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      runner-paths-changed: ${{ steps.detect.outputs.runner-paths-changed }}
    steps:
      - name: Detect runner-path changes
        id: detect
        uses: actions/github-script@v7
        with:
          script: |
            // push:main (and any non-PR event) → always eligible so main builds
            // always run and publish :latest + semver tags (AC4 / R3). The only
            // non-PR trigger for this workflow is `push: branches:[main]` (see
            // `on:`), so this is the main-build path.
            if (context.eventName !== 'pull_request') {
              core.setOutput('runner-paths-changed', 'true');
              core.info(`event=${context.eventName} — runner-image tier always eligible (push:main / AC4).`);
              return;
            }
            // Only main-targeted PRs run the heavy tier + feed the required gate,
            // mirroring the foundation-gate base-ref guard (.github/workflows/ci.yml
            // ~1152/1179). A PR onto a feature/release branch skips the tier; the
            // gate passes on a legitimate skip (code-review P2).
            const baseRef = context.payload.pull_request.base.ref;
            if (baseRef !== 'main') {
              core.setOutput('runner-paths-changed', 'false');
              core.info(`PR base is '${baseRef}' (not main) — runner-image tier skipped.`);
              return;
            }
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            let files;
            try {
              files = await github.paginate(
                github.rest.pulls.listFiles,
                { owner, repo, pull_number, per_page: 100 }
              );
            } catch (err) {
              // Fail SAFE, not open: if the file listing fails (API hiccup,
              // fork-PR token scope), run the tier rather than silently skip it.
              // The gate also independently fails on a non-success detect-changes
              // result, so a broken detector can never wave a runner-path PR
              // through (code-review P1).
              core.warning(`pulls.listFiles failed (${err.message}) — running the runner-image tier to fail safe.`);
              core.setOutput('runner-paths-changed', 'true');
              return;
            }
            // Watched path set (R9 — real module-prefixed paths). Includes the
            // compose build-graph files (they feed the AC8 cache key + the actual
            // build) and runners/VERSION (already under runners/). A PR touching
            // deliveryline-runner-contracts/**/schemas/** is included here, so a
            // schema change triggers BOTH images (AC9) with no extra job
            // (code-review P3).
            const watched = [
              'runners/',
              'deliveryline-runner-contracts/',
              'deliveryline-backend/src/main/java/org/dradgo/adapters/runner/',
              'docker-compose.yml',
              'docker-compose.ci.yml',
            ];
            const changed = files.some(f =>
              watched.some(p => f.filename.startsWith(p))
            );
            core.setOutput('runner-paths-changed', changed ? 'true' : 'false');
            core.info(`runner-paths-changed=${changed} (${files.length} files inspected).`);

  # ---------------------------------------------------------------------------
  # runner-image-build — REAL Codex + Claude images via compose (AC1, AC4, AC8;
  # R5, R6, R8). Builds with INSTALL_*_CLI=true (compose default = real npm
  # install). `docker compose --profile runners build` (R6 — a BARE
  # `docker compose build` skips the profiled runner services and builds
  # NEITHER). The CI-only docker-compose.ci.yml override attaches a BuildKit
  # local cache + threads IMAGE_VERSION; it does not change the build graph (the
  # documented local repro runs the override-free command — docs/setup-local.md).
  # ---------------------------------------------------------------------------
  runner-image-build:
    name: runner-image-build
    needs: [detect-changes]
    if: ${{ needs.detect-changes.outputs.runner-paths-changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      image-version: ${{ steps.meta.outputs.image-version }}
    env:
      # docker compose interpolates the ENTIRE root compose file at parse time
      # (regardless of --profile), so the postgres service's
      # ${POSTGRES_PASSWORD:?...} required-variable must resolve even though this
      # job only builds the runner images. Mirror the foundation-gate placeholder.
      POSTGRES_PASSWORD: deliveryline-ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        # docker-container driver — required for the override's `cache_to type=local`.
        uses: docker/setup-buildx-action@v3

      - name: Restore BuildKit layer cache
        # AC8 — keyed on a hash of the runner Dockerfiles + entrypoints +
        # lib/runner.mjs + test/mock-*.sh + vendored superpowers (all under
        # runners/**) plus the compose build wiring. A PR that doesn't touch the
        # runner image gets a full cache hit and skips the heavy npm-install build.
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: runner-buildx-${{ hashFiles('runners/**', 'docker-compose.yml', 'docker-compose.ci.yml') }}
          restore-keys: |
            runner-buildx-

      - name: Compute image tags + version
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # PR builds — pr-{n} tag + label (R8; prNumber = pull_request.number).
            IMAGE_VERSION="pr-${PR_NUMBER}"
            EXTRA_TAGS="pr-${PR_NUMBER}"
          else
            # main builds — :latest (added below by the re-tag) + a semver tag
            # sourced from runners/VERSION (OQ-2 resolution), passed through the
            # override as --build-arg IMAGE_VERSION (AC4).
            IMAGE_VERSION="$(tr -d '[:space:]' < runners/VERSION)"
            # Guard a missing/empty/malformed VERSION so we fail loudly here
            # rather than emit an invalid `docker tag deliveryline/...-runner:`
            # mid-loop later (code-review P5).
            if ! printf '%s' "$IMAGE_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$'; then
              echo "::error::runners/VERSION is empty or not semver-shaped ('${IMAGE_VERSION}') — cannot tag the main build."
              exit 1
            fi
            EXTRA_TAGS="latest ${IMAGE_VERSION}"
          fi
          echo "image-version=${IMAGE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tags=${EXTRA_TAGS}" >> "$GITHUB_OUTPUT"
          echo "Resolved IMAGE_VERSION=${IMAGE_VERSION}; extra tags: ${EXTRA_TAGS}"

      - name: Build REAL runner images (compose + profile runners)
        env:
          COMPOSE_BAKE: "true"
          IMAGE_VERSION: ${{ steps.meta.outputs.image-version }}
        run: |
          set -euo pipefail
          # R6: --profile runners (bare `docker compose build` builds neither
          # profiled service). R5: compose default INSTALL_*_CLI=true → REAL images.
          # The ci override adds ONLY the BuildKit cache + IMAGE_VERSION arg.
          docker compose -f docker-compose.yml -f docker-compose.ci.yml \
            --profile runners build 2>&1 | tee /tmp/runner-image-build.log

      - name: Swap BuildKit cache (bound growth)
        if: always()
        run: |
          # Classic move dance: build wrote fresh cache to .buildx-cache-new; on a
          # cache MISS actions/cache saves the swapped dir post-job. On a HIT the
          # key is immutable so nothing is re-saved (cache stays bounded).
          rm -rf /tmp/.buildx-cache
          if [ -d /tmp/.buildx-cache-new ]; then mv /tmp/.buildx-cache-new /tmp/.buildx-cache; fi

      - name: Verify images loaded + apply tag pins (AC4)
        env:
          EXTRA_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          # Fail loudly if compose/bake did not load the built images into the
          # local store (observability — don't let a silent no-load slip through).
          for img in deliveryline/codex-runner deliveryline/claude-runner; do
            if ! docker image inspect "${img}:latest" >/dev/null 2>&1; then
              echo "::error::${img}:latest not present after build — compose/bake did not --load the image."
              exit 1
            fi
          done
          # Apply the AC4 tag pins. PR → pr-{n}; main → latest (already) + semver.
          # NOTE: tags are local-daemon only — there is no registry push in scope
          # (workflow token is contents:read). They prove the tag convention and
          # feed a future publish story; the PR comment records them.
          for runner in codex claude; do
            for t in ${EXTRA_TAGS}; do
              docker tag "deliveryline/${runner}-runner:latest" "deliveryline/${runner}-runner:${t}"
              echo "Tagged deliveryline/${runner}-runner:${t}"
            done
          done

      - name: Save built images for the self-test job (AC7)
        run: |
          set -euo pipefail
          # AC7 ordering: self-test runs the EXACT images built here. Hosted-runner
          # jobs do NOT share a Docker daemon, so hand them over via a saved tar
          # (compose run in the self-test job uses the :latest tag).
          docker save deliveryline/codex-runner:latest deliveryline/claude-runner:latest \
            | gzip > /tmp/runner-images.tar.gz
          ls -lh /tmp/runner-images.tar.gz

      - name: Upload built images artifact
        uses: actions/upload-artifact@v4
        with:
          name: runner-images
          path: /tmp/runner-images.tar.gz
          if-no-files-found: error
          retention-days: 3

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runner-image-build-log
          path: /tmp/runner-image-build.log
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # runner-image-self-test — `--self-test` exit 0 on the REAL images (AC1, AC7;
  # R6). Loads the images built upstream and runs each entrypoint's --self-test
  # (verifies node + runner.mjs + the agent CLI version pin + the OpenSpec pin +
  # the vendored superpowers skills, then exit 0). Both images are tested even if
  # the first fails, so the PR comment reports both outcomes (AC9).
  # ---------------------------------------------------------------------------
  runner-image-self-test:
    name: runner-image-self-test
    needs: [detect-changes, runner-image-build]
    if: ${{ needs.detect-changes.outputs.runner-paths-changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      codex-selftest: ${{ steps.codex.outcome }}
      claude-selftest: ${{ steps.claude.outcome }}
    env:
      # `docker compose run` interpolates the root compose file at parse time, so
      # the postgres service's ${POSTGRES_PASSWORD:?...} required-variable must
      # resolve even though this job only runs the runner --self-test.
      POSTGRES_PASSWORD: deliveryline-ci
    steps:
      - name: Checkout
        # Needed so `docker compose run` can resolve the runner service definitions.
        uses: actions/checkout@v4

      - name: Download built images
        uses: actions/download-artifact@v4
        with:
          name: runner-images
          path: /tmp/images

      - name: Load built images
        run: |
          set -euo pipefail
          gunzip -c /tmp/images/runner-images.tar.gz | docker load
          docker image ls 'deliveryline/*-runner'
          # [env] disambiguation (code-review P6): if the images did not load,
          # fail HERE as an infra/env problem rather than letting the downstream
          # `docker compose run --self-test` surface it as a runner CONTRACT
          # failure. Mirrors the runner-contract-real Docker-reachability guard.
          for img in deliveryline/codex-runner deliveryline/claude-runner; do
            if ! docker image inspect "${img}:latest" >/dev/null 2>&1; then
              echo "::error::[env] ${img}:latest did not load from the runner-images artifact — infrastructure issue, NOT a --self-test contract failure. Re-run; if it persists, inspect the runner-image-build save/upload steps."
              exit 1
            fi
          done

      - name: Self-test codex runner (REAL image)
        id: codex
        continue-on-error: true
        run: |
          set -o pipefail
          # R6: `docker compose run --rm <svc> --self-test` auto-activates the
          # service's "runners" profile and passes --self-test to the entrypoint.
          # The image is already loaded, so compose does not rebuild.
          docker compose run --rm codex-runner --self-test 2>&1 | tee /tmp/codex-self-test.log

      - name: Self-test claude runner (REAL image)
        id: claude
        continue-on-error: true
        run: |
          set -o pipefail
          docker compose run --rm claude-runner --self-test 2>&1 | tee /tmp/claude-self-test.log

      - name: Upload self-test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runner-image-self-test-logs
          path: |
            /tmp/codex-self-test.log
            /tmp/claude-self-test.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Assert both self-tests passed
        run: |
          set -euo pipefail
          fail=0
          if [ "${{ steps.codex.outcome }}" != "success" ]; then
            echo "::error::codex runner --self-test FAILED — see the SELF-TEST FAIL line in the runner-image-self-test-logs artifact (deliveryline/codex-runner:latest)."
            fail=1
          fi
          if [ "${{ steps.claude.outcome }}" != "success" ]; then
            echo "::error::claude runner --self-test FAILED — see the SELF-TEST FAIL line in the runner-image-self-test-logs artifact (deliveryline/claude-runner:latest)."
            fail=1
          fi
          [ "$fail" -eq 0 ] && echo "Both runner images passed --self-test."
          exit $fail

  # ---------------------------------------------------------------------------
  # runner-contract-real — end-to-end RealRunnerContractIT (AC1, AC5, AC7; R4,
  # R10). `needs: runner-image-build` is for ORDERING only — the IT REBUILDS its
  # own offline mock images (deliveryline/{codex,claude}-runner:real-contract-it,
  # INSTALL_*_CLI=false) in @BeforeAll and does NOT consume the :pr-{n}/:latest
  # images this tier builds (AC7's "consumes the built images" parenthetical is
  # inaccurate — R4). On GitHub-hosted runners each job gets a CLEAN daemon, so
  # there is no cross-job layer reuse; the dependency just fails fast before the
  # ~15-min IT if the real build is broken. The IT is selected via the
  # `-Pdocker-runner-it` profile (clears the default Failsafe docker-runner-it
  # exclusion — R10), NOT a raw tag filter.
  # ---------------------------------------------------------------------------
  runner-contract-real:
    name: runner-contract-real
    needs: [detect-changes, runner-image-build]
    if: ${{ needs.detect-changes.outputs.runner-paths-changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Docker daemon is reachable (env-vs-contract disambiguation)
        run: |
          if ! docker info >/dev/null 2>&1; then
            echo "::error::[env] Docker daemon not reachable — RealRunnerContractIT cannot build its mock images. Infrastructure issue, NOT a contract regression. Re-run; if it persists, escalate to CI ops."
            exit 1
          fi
          echo "[env] Docker daemon reachable: $(docker version --format '{{.Server.Version}}')"

      - name: Run RealRunnerContractIT (-Pdocker-runner-it)
        env:
          # Match the foundation-gate env shape (.github/workflows/ci.yml foundation-gate)
          # — Spring docker-compose autoconfig + Flyway want a Postgres password
          # placeholder; the IT's own @ActiveProfiles drives the profile set.
          POSTGRES_PASSWORD: deliveryline-ci
          SPRING_PROFILES_ACTIVE: test
        run: |
          # AC5: NO blanket retry. If a container-cold-start / base-layer-pull
          # flake is observed, scope a retry to a pull/build step ONLY with an
          # inline justification + a deferred-work.md entry — never wrap the test.
          # -am keeps the freshest deliveryline-runner-contracts jar on the
          # classpath (runner-contracts-schema-stale-in-m2).
          # -Djacoco.check.skip=true: this job runs ONLY RealRunnerContractIT, so
          # the full-suite jacoco-check line threshold (0.75) can never be met and
          # would fail the build on coverage, not on the contract. Skip ONLY the
          # check (the jacoco-check execution binds <skip> to this property,
          # pom.xml) — prepare-agent/report still run so Failsafe's `@{argLine}`
          # stays substituted (a blanket -Djacoco.skip crashes the fork). Mirrors
          # the foundation-gate profile, which skips the check for the same reason;
          # coverage gating lives on backend-unit-tests / foundation-gate.
          ./mvnw -B -ntp -Pdocker-runner-it -pl deliveryline-backend -am verify \
            -Dit.test=RealRunnerContractIT \
            -Dfailsafe.failIfNoSpecifiedTests=false \
            -Djacoco.check.skip=true

      - name: Assert RealRunnerContractIT actually ran (no silent fail-open)
        run: |
          set -euo pipefail
          # failIfNoSpecifiedTests=false (above) is REQUIRED: `-am` runs Failsafe
          # across the reactor and only deliveryline-backend carries this IT, so
          # `true` would falsely fail the runner-contracts module ("no tests
          # match"). The trade-off is that a broken -Pdocker-runner-it selection
          # could pass green with the IT never executing — for a required merge
          # gate that is a fail-open. Guard it explicitly (code-review P4).
          report="deliveryline-backend/target/failsafe-reports/TEST-org.dradgo.integration.runners.RealRunnerContractIT.xml"
          if [ ! -f "$report" ]; then
            echo "::error::No failsafe report for RealRunnerContractIT — the IT did not run (broken -Pdocker-runner-it selection?). Failing rather than passing a gate where the contract test never executed."
            exit 1
          fi
          tests="$(grep -oE 'tests="[0-9]+"' "$report" | head -1 | grep -oE '[0-9]+' || true)"
          if [ -z "${tests:-}" ] || [ "$tests" -lt 1 ]; then
            echo "::error::RealRunnerContractIT report shows ${tests:-0} tests — the IT executed nothing."
            exit 1
          fi
          echo "RealRunnerContractIT ran ${tests} test(s)."

      - name: Upload failsafe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runner-contract-real-reports
          path: deliveryline-backend/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # runner-contract-real-gate — always-runs aggregator + PR summary comment
  # (AC3, AC6; R7/OQ-1). PASSES when the runner-image tier legitimately skipped
  # (no runner paths changed → docs-only PRs NOT blocked) OR all three jobs
  # succeeded. This is the branch-protection REQUIRED check (docs/ci-branch-
  # protection.md), so a runner-path PR is hard-blocked on a red real-contract
  # run while foundation-gate stays untouched (NOT widened — R7).
  # ---------------------------------------------------------------------------
  runner-contract-real-gate:
    name: runner-contract-real-gate
    needs: [detect-changes, runner-image-build, runner-image-self-test, runner-contract-real]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Escalate ONLY pull-requests: write for the upsert; workflow root stays read.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Assert runner-image tier outcome
        env:
          DETECT_RESULT: ${{ needs.detect-changes.result }}
          RUNNER_PATHS_CHANGED: ${{ needs.detect-changes.outputs.runner-paths-changed }}
          BUILD_RESULT: ${{ needs.runner-image-build.result }}
          SELFTEST_RESULT: ${{ needs.runner-image-self-test.result }}
          CONTRACT_RESULT: ${{ needs.runner-contract-real.result }}
        run: |
          set -euo pipefail
          # Fail CLOSED if the detector itself did not succeed (code-review P1):
          # otherwise a failed/skipped detect-changes leaves RUNNER_PATHS_CHANGED
          # empty, the "!= true" branch below would exit 0, and a runner-path PR
          # would merge with the three heavy jobs skipped and never validated.
          if [ "$DETECT_RESULT" != "success" ]; then
            echo "::error::detect-changes did not succeed (result=${DETECT_RESULT}) — cannot determine runner-path eligibility. Failing the gate rather than waving the PR through. Re-run; if it persists, check the detect-changes job log."
            exit 1
          fi
          if [ "$RUNNER_PATHS_CHANGED" != "true" ]; then
            echo "No runner paths changed — runner-image tier legitimately skipped. Gate PASSES (docs-only / unrelated PR is not blocked)."
            exit 0
          fi
          fail=0
          for pair in "runner-image-build=$BUILD_RESULT" "runner-image-self-test=$SELFTEST_RESULT" "runner-contract-real=$CONTRACT_RESULT"; do
            name="${pair%%=*}"; res="${pair#*=}"
            if [ "$res" != "success" ]; then
              echo "::error::${name} did not succeed (result=${res}) — runner-path PRs are blocked until the runner-image tier is green."
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "All runner-image tier jobs succeeded on a runner-path PR."

      - name: Upsert runner-image CI status comment (AC3)
        if: ${{ github.event_name == 'pull_request' && needs.detect-changes.outputs.runner-paths-changed == 'true' && always() }}
        uses: actions/github-script@v7
        env:
          BUILD_RESULT: ${{ needs.runner-image-build.result }}
          SELFTEST_RESULT: ${{ needs.runner-image-self-test.result }}
          CONTRACT_RESULT: ${{ needs.runner-contract-real.result }}
          CODEX_SELFTEST: ${{ needs.runner-image-self-test.outputs.codex-selftest }}
          CLAUDE_SELFTEST: ${{ needs.runner-image-self-test.outputs.claude-selftest }}
          IMAGE_TAGS: ${{ needs.runner-image-build.outputs.tags }}
        with:
          script: |
            // Deterministic marker (AC3) — upsert in place rather than spam.
            const marker = '<!-- runner-image-ci-status -->';
            const icon = (r) => r === 'success' ? '✅' : (r === 'skipped' ? '⏭️' : '❌');
            const env = process.env;
            const tags = env.IMAGE_TAGS ? env.IMAGE_TAGS.trim().split(/\s+/).join(', ') : '(n/a)';
            const body = [
              marker,
              '### Runner-image CI (story 3.34)',
              '',
              `- **Build (real Codex + Claude images):** ${icon(env.BUILD_RESULT)} \`${env.BUILD_RESULT}\` — tags: \`${tags}\``,
              `- **\`--self-test\` codex:** ${icon(env.CODEX_SELFTEST)} \`${env.CODEX_SELFTEST || 'n/a'}\``,
              `- **\`--self-test\` claude:** ${icon(env.CLAUDE_SELFTEST)} \`${env.CLAUDE_SELFTEST || 'n/a'}\``,
              `- **RealRunnerContractIT (\`runner-contract-real\`):** ${icon(env.CONTRACT_RESULT)} \`${env.CONTRACT_RESULT}\``,
              '',
              'Self-test stdout + failsafe reports are attached as job artifacts. This comment updates in place on each run.',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              core.info(`Updated existing runner-image-ci comment ${existing.id}.`);
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
              core.info('Created new runner-image-ci comment.');
            }
